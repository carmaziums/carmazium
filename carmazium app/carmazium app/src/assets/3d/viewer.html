<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#111113;overflow:hidden;width:100vw;height:100vh;touch-action:none;overscroll-behavior:none}
canvas{display:block;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#msg{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#606070;font-family:sans-serif;font-size:13px;
  text-align:center;padding:20px;pointer-events:none
}
</style>
</head>
<body>
<div id="msg">Loading 3D model...</div>

<script>
/* Sync stub — captures data URL before the module script below has run */
window._pendingGLB = null;
window.loadGLB = function(d) { window._pendingGLB = d; };
window._pendingZones = null;
window.setZones = function(json) { window._pendingZones = json; };
window._pendingDamagePins = null;
window.setDamagePins = function(json) { window._pendingDamagePins = json; };
// Disabled by default: buyer viewers cannot create seller damage selections.
window._surfacePickingEnabled = false;
window.setSurfacePickingEnabled = function(value) {
  window._surfacePickingEnabled = value === true;
};
window.onerror = function() {
  var m = document.getElementById('msg');
  if (m) { m.textContent = '3D viewer unavailable'; m.style.display = 'flex'; }
};
window.addEventListener('unhandledrejection', function() {
  var m = document.getElementById('msg');
  if (m) { m.textContent = '3D viewer unavailable'; m.style.display = 'flex'; }
});
</script>

<script type="module">
/*__THREE_BUNDLE__*/
const { THREE, GLTFLoader, OrbitControls } = window.__CARMAZIUM_THREE__;

/* ── Renderer ── */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
// A 2x phone DPR quadruples WebGL pixels; 1.5x reduces GPU fill while
// preserving sufficient detail for the damage-zone overlay on small screens.
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x111113, 1);
document.body.appendChild(renderer.domElement);

/* ── Scene + Camera ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(3, 1.5, 3);

/* ── Lighting: ambient + key + fill (no PBR needed) ── */
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
var keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(4, 6, 4);
scene.add(keyLight);
var fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(-4, 2, -3);
scene.add(fillLight);

/* ── Orbit controls: one-finger drag to rotate ── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enableZoom = false;
controls.enablePan = false;
controls.autoRotate = false;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI * 0.72;

// Keep native ScrollView out of an active car-rotation gesture.  This complements
// the RN-side touch capture: WebView is a separate touch-handling surface.
function reportInteraction(active) {
  if (!window.ReactNativeWebView) return;
  window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'orbitInteraction', active: !!active }));
}
controls.addEventListener('start', function() { reportInteraction(true); });
controls.addEventListener('end', function() { reportInteraction(false); });

// Native buttons provide a reliable alternative to drag, especially for users
// who struggle with touch gesture arbitration.  Tilt respects OrbitControls'
// original vertical safety limits, and never enables free pan or zoom.
window.nudgeVehicle = function(direction) {
  if (!_modelInfo) return;
  var offset = camera.position.clone().sub(controls.target);
  var spherical = new THREE.Spherical().setFromVector3(offset);
  var step = Math.PI / 12;
  if (direction === 'left') spherical.theta += step;
  else if (direction === 'right') spherical.theta -= step;
  else if (direction === 'up') spherical.phi -= step;
  else if (direction === 'down') spherical.phi += step;
  else return;
  spherical.phi = Math.max(controls.minPolarAngle, Math.min(controls.maxPolarAngle, spherical.phi));
  camera.position.copy(controls.target).add(offset.setFromSpherical(spherical));
  camera.lookAt(controls.target);
  controls.update();
  invalidate();
};

/* ── Zone projection: keeps hotspots glued to the model as it rotates ──
   Zones are authored as fractions of the loaded model's own bounding box
   (fx/fy/fz, 0..1), resolved against the actual box/center/scale once the
   GLB is loaded, then projected through the live camera on a throttled
   interval (decoupled from the render loop so orbiting stays smooth).
   Occlusion is approximated analytically (outward normal from box-center
   vs. camera direction) rather than raycasting the mesh — with 23 zones,
   a per-zone raycast against the full model every tick was the actual
   cause of the jank on this screen. */
var _modelInfo = null; // { model, min, size, center, scale }
var _zones = [];
// Each entry is a separate defect, even when several share the same panel.
// Pins use immutable record IDs and normalized mesh coordinates.
var _damagePins = [];
var _vec = new THREE.Vector3();

/* ── Seller-only direct surface selection ────────────────────────────────────
   Only raycast on a confirmed short tap, never during an orbit gesture or a
   render frame. A hit is a preliminary point on the ILLUSTRATIVE mesh; the
   seller must confirm/change the suggested real vehicle panel in the editor.
   The original bounding-box fractions are portable across the model's
   scale/centering transforms. */
const damageRaycaster = new THREE.Raycaster();
const damagePointer = new THREE.Vector2();
var activeTap = null;
const MAX_TAP_TRAVEL_PX = 10;
const MAX_TAP_DURATION_MS = 550;

function closestDamageZone(point) {
  if (!_zones.length || !_modelInfo) return null;
  var bestId = null;
  var bestDistance = Infinity;
  for (var i = 0; i < _zones.length; i++) {
    var z = _zones[i];
    // Compare physical coordinates, not percentages, so short axes don't
    // dominate distance on sedan or SUV models.
    var dx = (point.fx - z.fx) * _modelInfo.size.x;
    var dy = (point.fy - z.fy) * _modelInfo.size.y;
    var dz = (point.fz - z.fz) * _modelInfo.size.z;
    var distance = dx * dx + dy * dy + dz * dz;
    if (distance < bestDistance) { bestDistance = distance; bestId = z.id; }
  }
  return bestId;
}
function pickDamageAt(clientX, clientY) {
  if (!window._surfacePickingEnabled || !_modelInfo || !window.ReactNativeWebView) return;
  var bounds = renderer.domElement.getBoundingClientRect();
  if (bounds.width <= 0 || bounds.height <= 0) return;
  damagePointer.set(
    ((clientX - bounds.left) / bounds.width) * 2 - 1,
    -((clientY - bounds.top) / bounds.height) * 2 + 1
  );
  damageRaycaster.setFromCamera(damagePointer, camera);
  var hits = damageRaycaster.intersectObject(_modelInfo.model, true);
  if (!hits.length) return; // Do not create a false mark in empty space.
  var world = hits[0].point;
  var m = _modelInfo;
  var raw = world.clone().divideScalar(m.scale).add(m.center);
  var axis = function(value, min, size) {
    return size > 0 ? Math.max(0, Math.min(1, (value - min) / size)) : 0.5;
  };
  var point = {
    fx: axis(raw.x, m.min.x, m.size.x),
    fy: axis(raw.y, m.min.y, m.size.y),
    fz: axis(raw.z, m.min.z, m.size.z)
  };
  window.ReactNativeWebView.postMessage(JSON.stringify({
    type: 'surfaceDamageTap',
    zoneId: closestDamageZone(point),
    point: point
  }));
}
renderer.domElement.addEventListener('pointerdown', function(event) {
  if (!window._surfacePickingEnabled || event.isPrimary === false) return;
  activeTap = { id: event.pointerId, x: event.clientX, y: event.clientY, time: Date.now(), moved: false };
});
renderer.domElement.addEventListener('pointermove', function(event) {
  if (!activeTap || event.pointerId !== activeTap.id) return;
  if (Math.hypot(event.clientX - activeTap.x, event.clientY - activeTap.y) > MAX_TAP_TRAVEL_PX) {
    activeTap.moved = true;
  }
});
renderer.domElement.addEventListener('pointerup', function(event) {
  if (!activeTap || event.pointerId !== activeTap.id) return;
  var tap = activeTap; activeTap = null;
  var distance = Math.hypot(event.clientX - tap.x, event.clientY - tap.y);
  if (!tap.moved && distance <= MAX_TAP_TRAVEL_PX && Date.now() - tap.time <= MAX_TAP_DURATION_MS) {
    pickDamageAt(event.clientX, event.clientY);
  }
});
renderer.domElement.addEventListener('pointercancel', function() { activeTap = null; });
renderer.domElement.addEventListener('lostpointercapture', function() { activeTap = null; });
renderer.domElement.addEventListener('pointerdown', function(event) {
  // A second finger is always a gesture, not a new damage marker.
  if (event.isPrimary === false) activeTap = null;
});
window.setSurfacePickingEnabled = function(value) {
  window._surfacePickingEnabled = value === true;
  if (!window._surfacePickingEnabled) activeTap = null;
};

function resolveZoneWorldPos(zone) {
  var m = _modelInfo;
  var raw = new THREE.Vector3(
    m.min.x + m.size.x * zone.fx,
    m.min.y + m.size.y * zone.fy,
    m.min.z + m.size.z * zone.fz
  );
  return raw.sub(m.center).multiplyScalar(m.scale);
}

function postZonePositions() {
  if (!_modelInfo || !_zones.length || !window.ReactNativeWebView) return;
  var m = _modelInfo;
  var out = [];
  for (var i = 0; i < _zones.length; i++) {
    var zone = _zones[i];
    var worldPos = resolveZoneWorldPos(zone);
    var ndc = worldPos.clone().project(camera);
    var onScreen = ndc.z < 1 && ndc.x > -1.3 && ndc.x < 1.3 && ndc.y > -1.3 && ndc.y < 1.3;

    // Outward normal approximated from the zone's position relative to the
    // box center (works well enough for a roughly-convex car body).
    var nx = (zone.fx - 0.5) * m.size.x;
    var ny = (zone.fy - 0.5) * m.size.y;
    var nz = (zone.fz - 0.5) * m.size.z;
    var normal = _vec.set(nx, ny, nz).normalize();
    var toCam = camera.position.clone().sub(worldPos).normalize();
    var facingCamera = normal.dot(toCam) > -0.15;

    out.push({
      id: zone.id,
      x: (ndc.x * 0.5 + 0.5) * 100,
      y: (1 - (ndc.y * 0.5 + 0.5)) * 100,
      visible: onScreen && facingCamera,
    });
  }
  window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'zonePositions', positions: out }));
  // Only calculate during the existing throttled projection pass (~10Hz).
  // No mesh raycasts: hit-testing remains confined to seller finger taps.
  var pins = [];
  for (var j = 0; j < _damagePins.length; j++) {
    var pin = _damagePins[j];
    var pinWorld = resolveZoneWorldPos(pin);
    var projected = pinWorld.clone().project(camera);
    var visible = projected.z > -1 && projected.z < 1
      && Math.abs(projected.x) <= 1 && Math.abs(projected.y) <= 1;
    var normal = _vec.set(
      (pin.fx - 0.5) * m.size.x,
      (pin.fy - 0.5) * m.size.y,
      (pin.fz - 0.5) * m.size.z
    ).normalize();
    var toCamera = camera.position.clone().sub(pinWorld).normalize();
    // Same approximate occlusion convention as legacy zone hotspots.
    visible = visible && normal.dot(toCamera) > -0.15;
    pins.push({
      id: pin.id,
      x: (projected.x * 0.5 + 0.5) * 100,
      y: (1 - (projected.y * 0.5 + 0.5)) * 100,
      visible: visible
    });
  }
  window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'damagePinPositions', positions: pins }));
}

/* ── Render only on a camera/model change ──
   OrbitControls damping still advances each animation frame, but a stationary
   car no longer submits redundant GPU draw calls or hotspot bridge messages.
   Project at most 10 times/s while moving, plus the last settled frame. */
var renderPending = true;
var projectionPending = true;
var lastProjectionMs = -1000;
function invalidate() {
  renderPending = true;
  projectionPending = true;
}
controls.addEventListener('change', invalidate);

(function loop(now) {
  requestAnimationFrame(loop);
  if (document.hidden) return;
  controls.update();
  if (renderPending) {
    renderPending = false;
    renderer.render(scene, camera);
  }
  if (projectionPending && _modelInfo && _zones.length && now - lastProjectionMs >= 100) {
    projectionPending = false;
    lastProjectionMs = now;
    postZonePositions();
  }
})(0);
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) invalidate();
});

/* ── Resize ── */
window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  invalidate();
});

/* ── GLB loader called from RN via injectJavaScript ── */
var loader = new GLTFLoader();
function doLoad(dataUrl) {
  var msgEl = document.getElementById('msg');
  if (msgEl) msgEl.style.display = 'none';

  loader.load(
    dataUrl,
    function(gltf) {
      var model = gltf.scene;
      var box = new THREE.Box3().setFromObject(model);
      var center = box.getCenter(new THREE.Vector3());
      var size = box.getSize(new THREE.Vector3());
      var scale = 3 / Math.max(size.x, size.y, size.z);
      // Captured before `center` is mutated below — zone projection needs
      // the original box/center to resolve fx/fy/fz fractions correctly.
      _modelInfo = { model: model, min: box.min.clone(), size: size.clone(), center: center.clone(), scale: scale };
      model.scale.setScalar(scale);
      model.position.copy(center.multiplyScalar(-scale));
      scene.add(model);
      controls.target.set(0, size.y * scale * 0.3, 0);
      controls.update();
      invalidate();
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'modelReady' }));
    },
    undefined,
    function() {
      var m = document.getElementById('msg');
      if (m) { m.textContent = 'Could not load 3D model'; m.style.display = 'flex'; }
    }
  );
}

function doSetZones(json) {
  try { _zones = JSON.parse(json); } catch (e) { _zones = []; }
  invalidate();
}
function doSetDamagePins(json) {
  try {
    var parsed = JSON.parse(json);
    _damagePins = Array.isArray(parsed) ? parsed.filter(function(pin) {
      return pin && typeof pin.id === 'string'
        && ['fx','fy','fz'].every(function(k) {
          return typeof pin[k] === 'number' && isFinite(pin[k]) && pin[k] >= 0 && pin[k] <= 1;
        });
    }) : [];
  } catch (e) { _damagePins = []; }
  invalidate();
}

/* Pick up anything that arrived while the module was still loading */
if (window._pendingGLB) { doLoad(window._pendingGLB); }
if (window._pendingZones) { doSetZones(window._pendingZones); }
if (window._pendingDamagePins) { doSetDamagePins(window._pendingDamagePins); }

/* Override stubs with real implementations */
window.loadGLB = doLoad;
window.setZones = doSetZones;
window.setDamagePins = doSetDamagePins;
</script>

</body>
</html>
