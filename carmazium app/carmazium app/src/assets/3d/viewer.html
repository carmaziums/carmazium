<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111113;overflow:hidden;width:100vw;height:100vh}
#msg{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#606070;font-family:sans-serif;font-size:13px;
  text-align:center;padding:20px;pointer-events:none
}
</style>
</head>
<body>
<div id="msg">Loading 3D model...</div>

<script>
function report(type) {
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({type:type}));
}
function viewerFailed() {
  var m = document.getElementById('msg');
  if (m) { m.textContent = '3D viewer unavailable'; m.style.display = 'flex'; }
  report('viewerError');
}
window.onerror = viewerFailed;
window.addEventListener('unhandledrejection', viewerFailed);
</script>

<script type="module">
/*__THREE_BUNDLE__*/
const { THREE, GLTFLoader, OrbitControls } = window.__CARMAZIUM_THREE__;

/* ── Renderer ── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x111113, 1);
document.body.appendChild(renderer.domElement);

/* ── Scene + Camera ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(3, 1.5, 3);

/* ── Lighting: ambient + key + fill (no PBR needed) ── */
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
var keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(4, 6, 4);
scene.add(keyLight);
var fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(-4, 2, -3);
scene.add(fillLight);

/* ── Orbit controls: one-finger drag to rotate ── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enableZoom = false;
controls.enablePan = false;
controls.autoRotate = false;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI * 0.72;

/* ── Zone projection: keeps hotspots glued to the model as it rotates ──
   Zones are authored as fractions of the loaded model's own bounding box
   (fx/fy/fz, 0..1), resolved against the actual box/center/scale once the
   GLB is loaded, then projected through the live camera on a throttled
   interval (decoupled from the render loop so orbiting stays smooth).
   Occlusion is approximated analytically (outward normal from box-center
   vs. camera direction) rather than raycasting the mesh — with 23 zones,
   a per-zone raycast against the full model every tick was the actual
   cause of the jank on this screen. */
var _modelInfo = null; // { model, min, size, center, scale }
var _zones = [];
var _vec = new THREE.Vector3();

function resolveZoneWorldPos(zone) {
  var m = _modelInfo;
  var raw = new THREE.Vector3(
    m.min.x + m.size.x * zone.fx,
    m.min.y + m.size.y * zone.fy,
    m.min.z + m.size.z * zone.fz
  );
  return raw.sub(m.center).multiplyScalar(m.scale);
}

function postZonePositions() {
  if (!_modelInfo || !_zones.length || !window.ReactNativeWebView) return;
  var m = _modelInfo;
  var out = [];
  for (var i = 0; i < _zones.length; i++) {
    var zone = _zones[i];
    var worldPos = resolveZoneWorldPos(zone);
    var ndc = worldPos.clone().project(camera);
    var onScreen = ndc.z < 1 && ndc.x > -1.3 && ndc.x < 1.3 && ndc.y > -1.3 && ndc.y < 1.3;

    // Outward normal approximated from the zone's position relative to the
    // box center (works well enough for a roughly-convex car body).
    var nx = (zone.fx - 0.5) * m.size.x;
    var ny = (zone.fy - 0.5) * m.size.y;
    var nz = (zone.fz - 0.5) * m.size.z;
    var normal = _vec.set(nx, ny, nz).normalize();
    var toCam = camera.position.clone().sub(worldPos).normalize();
    var facingCamera = normal.dot(toCam) > -0.15;

    out.push({
      id: zone.id,
      x: (ndc.x * 0.5 + 0.5) * 100,
      y: (1 - (ndc.y * 0.5 + 0.5)) * 100,
      visible: onScreen && facingCamera,
    });
  }
  window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'zonePositions', positions: out }));
}

/* ── Render loop ── */
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

/* Zone positions update on their own timer, independent of render FPS —
   ~8fps is plenty for hotspots tracking a drag-to-rotate gesture and keeps
   the render loop itself free of per-frame extra work. */
setInterval(postZonePositions, 120);

/* ── Resize ── */
window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ── GLB loader called from RN via injectJavaScript ── */
// Exact mesh taps; never create a mark from a drag, pinch or empty space.
var _editable = false;
window.setEditable = function(value) { _editable = value === true; };
const surfaceRay = new THREE.Raycaster();
const touchPointers = new Set();
let tapStart = null;
const canvas = renderer.domElement;
canvas.addEventListener("pointerdown", function(e) {
  touchPointers.add(e.pointerId);
  tapStart = _editable && touchPointers.size === 1 && e.button === 0 ? {id:e.pointerId,x:e.clientX,y:e.clientY,moved:false} : null;
});
canvas.addEventListener("pointermove", function(e) {
  if(tapStart && Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y)>8) tapStart.moved=true;
});
canvas.addEventListener("pointercancel", function(e) { touchPointers.delete(e.pointerId); tapStart=null; });
canvas.addEventListener("pointerup", function(e) {
  const start=tapStart; tapStart=null; touchPointers.delete(e.pointerId);
  if(!_editable || !_modelInfo || !start || start.id!==e.pointerId || start.moved || touchPointers.size || Math.hypot(e.clientX-start.x,e.clientY-start.y)>8) return;
  const rect=canvas.getBoundingClientRect(); if(!rect.width || !rect.height) return;
  const pointer=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,1-(e.clientY-rect.top)/rect.height*2);
  camera.updateMatrixWorld(true); _modelInfo.model.updateMatrixWorld(true);
  surfaceRay.setFromCamera(pointer,camera);
  const hit=surfaceRay.intersectObject(_modelInfo.model,true)[0]; if(!hit) return;
  const m=_modelInfo, raw=hit.point.clone().divideScalar(m.scale).add(m.center);
  const clamp=v=>Math.max(0,Math.min(1,v));
  const point={fx:clamp((raw.x-m.min.x)/m.size.x),fy:clamp((raw.y-m.min.y)/m.size.y),fz:clamp((raw.z-m.min.z)/m.size.z)};
  if(Object.values(point).every(Number.isFinite) && window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({type:"surfaceTap",point}));
});

var loader = new GLTFLoader();
var chunks = [], expectedChunks = 0, modelStarted = false, modelReady = false;
window.reportViewerReady = function() { report('viewerReady'); };
window.beginModel = function(count) {
  if (modelStarted || !Number.isInteger(count) || count < 1 || count > 1024) return;
  chunks = []; expectedChunks = count;
};
window.appendModelChunk = function(index, value) {
  if (modelStarted || index !== chunks.length || index >= expectedChunks || typeof value !== 'string') { viewerFailed(); return; }
  chunks.push(value);
};
window.finishModel = function() {
  if (modelStarted) return;
  if (chunks.length !== expectedChunks || !expectedChunks) { viewerFailed(); return; }
  modelStarted = true;
  try {
    var raw = atob(chunks.join(''));
    chunks = [];
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    loader.parse(bytes.buffer, '', function(gltf) {
      try {
        var model = gltf.scene;
        var box = new THREE.Box3().setFromObject(model);
        var center = box.getCenter(new THREE.Vector3());
        var size = box.getSize(new THREE.Vector3());
        var scale = 3 / Math.max(size.x, size.y, size.z);
        if (!Number.isFinite(scale) || scale <= 0) throw new Error('Invalid model bounds');
        _modelInfo = { model: model, min: box.min.clone(), size: size.clone(), center: center.clone(), scale: scale };
        model.scale.setScalar(scale);
        model.position.copy(center.multiplyScalar(-scale));
        scene.add(model);
        controls.target.set(0, size.y * scale * 0.3, 0);
        controls.update();
        renderer.render(scene, camera);
        modelReady = true;
        var m = document.getElementById('msg');
        if (m) m.style.display = 'none';
        report('modelReady');
        postZonePositions();
      } catch (e) { viewerFailed(); }
    }, viewerFailed);
  } catch (e) { viewerFailed(); }
};
window.setZones = function(json) {
  try { _zones = JSON.parse(json); if (modelReady) postZonePositions(); } catch (e) { _zones = []; }
};
renderer.domElement.addEventListener('webglcontextlost', function(e) { e.preventDefault(); viewerFailed(); });
window.reportViewerReady();
</script>

</body>
</html>
