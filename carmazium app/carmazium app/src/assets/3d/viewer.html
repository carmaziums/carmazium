<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#111113;overflow:hidden;width:100vw;height:100vh;touch-action:none;overscroll-behavior:none}
canvas{display:block;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#msg{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#606070;font-family:sans-serif;font-size:13px;
  text-align:center;padding:20px;pointer-events:none
}
</style>
</head>
<body>
<div id="msg">Loading 3D model...</div>

<script>
/* Sync stub — captures data URL before the module script below has run */
window._pendingGLB = null;
window.loadGLB = function(d) { window._pendingGLB = d; };
window._pendingZones = null;
window.setZones = function(json) { window._pendingZones = json; };
window.onerror = function() {
  var m = document.getElementById('msg');
  if (m) { m.textContent = '3D viewer unavailable'; m.style.display = 'flex'; }
};
window.addEventListener('unhandledrejection', function() {
  var m = document.getElementById('msg');
  if (m) { m.textContent = '3D viewer unavailable'; m.style.display = 'flex'; }
});
</script>

<script type="module">
/*__THREE_BUNDLE__*/
const { THREE, GLTFLoader, OrbitControls } = window.__CARMAZIUM_THREE__;

/* ── Renderer ── */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
// A 2x phone DPR quadruples WebGL pixels; 1.5x reduces GPU fill while
// preserving sufficient detail for the damage-zone overlay on small screens.
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x111113, 1);
document.body.appendChild(renderer.domElement);

/* ── Scene + Camera ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(3, 1.5, 3);

/* ── Lighting: ambient + key + fill (no PBR needed) ── */
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
var keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(4, 6, 4);
scene.add(keyLight);
var fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
fillLight.position.set(-4, 2, -3);
scene.add(fillLight);

/* ── Orbit controls: one-finger drag to rotate ── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enableZoom = false;
controls.enablePan = false;
controls.autoRotate = false;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI * 0.72;

// Keep native ScrollView out of an active car-rotation gesture.  This complements
// the RN-side touch capture: WebView is a separate touch-handling surface.
function reportInteraction(active) {
  if (!window.ReactNativeWebView) return;
  window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'orbitInteraction', active: !!active }));
}
controls.addEventListener('start', function() { reportInteraction(true); });
controls.addEventListener('end', function() { reportInteraction(false); });

// Native buttons provide a reliable alternative to drag, especially for users
// who struggle with touch gesture arbitration.  Tilt respects OrbitControls'
// original vertical safety limits, and never enables free pan or zoom.
window.nudgeVehicle = function(direction) {
  if (!_modelInfo) return;
  var offset = camera.position.clone().sub(controls.target);
  var spherical = new THREE.Spherical().setFromVector3(offset);
  var step = Math.PI / 12;
  if (direction === 'left') spherical.theta += step;
  else if (direction === 'right') spherical.theta -= step;
  else if (direction === 'up') spherical.phi -= step;
  else if (direction === 'down') spherical.phi += step;
  else return;
  spherical.phi = Math.max(controls.minPolarAngle, Math.min(controls.maxPolarAngle, spherical.phi));
  camera.position.copy(controls.target).add(offset.setFromSpherical(spherical));
  camera.lookAt(controls.target);
  controls.update();
  invalidate();
};

/* ── Zone projection: keeps hotspots glued to the model as it rotates ──
   Zones are authored as fractions of the loaded model's own bounding box
   (fx/fy/fz, 0..1), resolved against the actual box/center/scale once the
   GLB is loaded, then projected through the live camera on a throttled
   interval (decoupled from the render loop so orbiting stays smooth).
   Occlusion is approximated analytically (outward normal from box-center
   vs. camera direction) rather than raycasting the mesh — with 23 zones,
   a per-zone raycast against the full model every tick was the actual
   cause of the jank on this screen. */
var _modelInfo = null; // { model, min, size, center, scale }
var _zones = [];
var _vec = new THREE.Vector3();

function resolveZoneWorldPos(zone) {
  var m = _modelInfo;
  var raw = new THREE.Vector3(
    m.min.x + m.size.x * zone.fx,
    m.min.y + m.size.y * zone.fy,
    m.min.z + m.size.z * zone.fz
  );
  return raw.sub(m.center).multiplyScalar(m.scale);
}

function postZonePositions() {
  if (!_modelInfo || !_zones.length || !window.ReactNativeWebView) return;
  var m = _modelInfo;
  var out = [];
  for (var i = 0; i < _zones.length; i++) {
    var zone = _zones[i];
    var worldPos = resolveZoneWorldPos(zone);
    var ndc = worldPos.clone().project(camera);
    var onScreen = ndc.z < 1 && ndc.x > -1.3 && ndc.x < 1.3 && ndc.y > -1.3 && ndc.y < 1.3;

    // Outward normal approximated from the zone's position relative to the
    // box center (works well enough for a roughly-convex car body).
    var nx = (zone.fx - 0.5) * m.size.x;
    var ny = (zone.fy - 0.5) * m.size.y;
    var nz = (zone.fz - 0.5) * m.size.z;
    var normal = _vec.set(nx, ny, nz).normalize();
    var toCam = camera.position.clone().sub(worldPos).normalize();
    var facingCamera = normal.dot(toCam) > -0.15;

    out.push({
      id: zone.id,
      x: (ndc.x * 0.5 + 0.5) * 100,
      y: (1 - (ndc.y * 0.5 + 0.5)) * 100,
      visible: onScreen && facingCamera,
    });
  }
  window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'zonePositions', positions: out }));
}

/* ── Render only on a camera/model change ──
   OrbitControls damping still advances each animation frame, but a stationary
   car no longer submits redundant GPU draw calls or hotspot bridge messages.
   Project at most 10 times/s while moving, plus the last settled frame. */
var renderPending = true;
var projectionPending = true;
var lastProjectionMs = -1000;
function invalidate() {
  renderPending = true;
  projectionPending = true;
}
controls.addEventListener('change', invalidate);

(function loop(now) {
  requestAnimationFrame(loop);
  if (document.hidden) return;
  controls.update();
  if (renderPending) {
    renderPending = false;
    renderer.render(scene, camera);
  }
  if (projectionPending && _modelInfo && _zones.length && now - lastProjectionMs >= 100) {
    projectionPending = false;
    lastProjectionMs = now;
    postZonePositions();
  }
})(0);
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) invalidate();
});

/* ── Resize ── */
window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  invalidate();
});

/* ── GLB loader called from RN via injectJavaScript ── */
var loader = new GLTFLoader();
function doLoad(dataUrl) {
  var msgEl = document.getElementById('msg');
  if (msgEl) msgEl.style.display = 'none';

  loader.load(
    dataUrl,
    function(gltf) {
      var model = gltf.scene;
      var box = new THREE.Box3().setFromObject(model);
      var center = box.getCenter(new THREE.Vector3());
      var size = box.getSize(new THREE.Vector3());
      var scale = 3 / Math.max(size.x, size.y, size.z);
      // Captured before `center` is mutated below — zone projection needs
      // the original box/center to resolve fx/fy/fz fractions correctly.
      _modelInfo = { model: model, min: box.min.clone(), size: size.clone(), center: center.clone(), scale: scale };
      model.scale.setScalar(scale);
      model.position.copy(center.multiplyScalar(-scale));
      scene.add(model);
      controls.target.set(0, size.y * scale * 0.3, 0);
      controls.update();
      invalidate();
    },
    undefined,
    function() {
      var m = document.getElementById('msg');
      if (m) { m.textContent = 'Could not load 3D model'; m.style.display = 'flex'; }
    }
  );
}

function doSetZones(json) {
  try { _zones = JSON.parse(json); } catch (e) { _zones = []; }
  invalidate();
}

/* Pick up anything that arrived while the module was still loading */
if (window._pendingGLB) { doLoad(window._pendingGLB); }
if (window._pendingZones) { doSetZones(window._pendingZones); }

/* Override stubs with real implementations */
window.loadGLB = doLoad;
window.setZones = doSetZones;
</script>

</body>
</html>
