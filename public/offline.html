<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · CarMazium</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0A0A0C; color: #F1F5F9; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 20px 0 8px; }
  p { color: #94A3B8; line-height: 1.5; max-width: 320px; margin: 0 auto 24px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px;
           background: #ED1C24; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="CarMazium">
    <h1>You're offline</h1>
    <p>CarMazium needs an internet connection to show live cars, auctions and prices.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
