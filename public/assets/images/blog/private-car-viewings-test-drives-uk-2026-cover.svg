<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Safe Car Viewings &amp; Test Drives">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#164362"/></linearGradient>
<linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9eabb7"/><stop offset=".5" stop-color="#536573"/><stop offset="1" stop-color="#25323b"/></linearGradient>
</defs>
<rect width="1200" height="600" fill="url(#bg)"/>
<circle cx="1000" cy="100" r="200" fill="#2fa8ff" opacity=".08"/>
<text x="150" y="112" fill="#fff" font-family="Arial" font-size="56" font-weight="800">Safe Car Viewings</text>
<text x="150" y="176" fill="#58b5ff" font-family="Arial" font-size="50" font-weight="800">&amp; Test Drives</text>
<text x="150" y="218" fill="#c1d2df" font-family="Arial" font-size="17" font-weight="700" letter-spacing="3">PRIVATE SALE SAFETY • UK GUIDE 2026</text>
<g transform="translate(150 300)" font-family="Arial">
<rect x="0" y="0" width="250" height="145" rx="22" fill="#fff" opacity=".08" stroke="#71b9ee"/>
<text x="25" y="43" fill="#58b5ff" font-size="19" font-weight="800">IDENTITY</text>
<text x="25" y="80" fill="#fff" font-size="16">Know who is visiting</text><rect x="280" y="0" width="250" height="145" rx="22" fill="#fff" opacity=".08" stroke="#71b9ee"/>
<text x="305" y="43" fill="#58b5ff" font-size="19" font-weight="800">INSURANCE</text>
<text x="305" y="80" fill="#fff" font-size="16">Check cover first</text><rect x="560" y="0" width="250" height="145" rx="22" fill="#fff" opacity=".08" stroke="#71b9ee"/>
<text x="585" y="43" fill="#58b5ff" font-size="19" font-weight="800">KEYS</text>
<text x="585" y="80" fill="#fff" font-size="16">Stay with the vehicle</text>
</g>
<!-- generic unbranded car -->
<g transform="translate(810 370)">
<ellipse cx="125" cy="100" rx="130" ry="17" fill="#020609" opacity=".45"/>
<path d="M18 64 C36 42 62 31 92 26 L162 21 C195 22 222 31 244 48 L270 67 C280 75 283 84 280 94 L273 106 L10 106 L6 92 C5 82 10 73 18 64Z" fill="url(#car)" stroke="#becad3" stroke-width="2"/>
<path d="M76 32 C101 25 135 25 166 27 C188 28 207 35 223 47 L237 59 L68 59 C68 48 71 39 76 32Z" fill="#31546e" stroke="#a5bac9" stroke-width="2"/>
<circle cx="62" cy="106" r="29" fill="#0f151b" stroke="#a3b1bc" stroke-width="3"/><circle cx="62" cy="106" r="13" fill="#55636e"/>
<circle cx="216" cy="106" r="29" fill="#0f151b" stroke="#a3b1bc" stroke-width="3"/><circle cx="216" cy="106" r="13" fill="#55636e"/>
</g>
<text x="150" y="525" fill="#fff" font-family="Arial" font-size="24" font-weight="800">CarMazium</text>
<text x="1040" y="525" text-anchor="end" fill="#91a9bb" font-family="Arial" font-size="12" font-weight="700" letter-spacing="2">UK AUTOMOTIVE GUIDE 2026</text>
</svg>