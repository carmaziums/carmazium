<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Does ULEZ Compliance Affect a Car's Value? UK Guide 2026</title>
<desc id="desc">CarMazium editorial cover showing a generic unbranded vehicle, a clean-air-zone symbol, and resale-value guidance for UK drivers.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06152a"/>
    <stop offset="0.55" stop-color="#0b2947"/>
    <stop offset="1" stop-color="#123f5e"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a3d50"/>
    <stop offset="1" stop-color="#101a26"/>
  </linearGradient>
  <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#97a7b5"/>
    <stop offset="0.45" stop-color="#506172"/>
    <stop offset="1" stop-color="#202d39"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8ec7e8"/>
    <stop offset="1" stop-color="#1c3d56"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
  </filter>
</defs>

<rect width="1200" height="600" fill="url(#bg)"/>
<circle cx="1000" cy="95" r="190" fill="#39b7ff" opacity=".08"/>
<circle cx="1040" cy="430" r="220" fill="#3fd27a" opacity=".05"/>

<!-- abstract UK city skyline -->
<g opacity=".22" fill="#9bb2c5">
