  <rect x="92" y="285" width="60" height="140"/>
  <rect x="165" y="300" width="42" height="125"/>
  <rect x="220" y="245" width="70" height="180"/>
  <rect x="305" y="330" width="55" height="95"/>
  <rect x="380" y="265" width="62" height="160"/>
  <rect x="460" y="305" width="46" height="120"/>
  <rect x="525" y="230" width="70" height="195"/>
  <rect x="610" y="292" width="54" height="133"/>
  <rect x="680" y="250" width="75" height="175"/>
  <rect x="775" y="320" width="55" height="105"/>
  <rect x="850" y="275" width="70" height="150"/>
  <rect x="940" y="240" width="58" height="185"/>
  <rect x="1015" y="300" width="68" height="125"/>
