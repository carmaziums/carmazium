<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#08192f"/><stop offset=".5" stop-color="#0c2846"/><stop offset="1" stop-color="#123f5f"/></linearGradient></defs>
<rect width="1200" height="600" fill="url(#g)"/>
<text x="150" y="112" fill="#fff" font-family="Arial" font-size="54" font-weight="800">CarMazium Auction vs Retail</text>
<text x="150" y="176" fill="#56b3ff" font-family="Arial" font-size="46" font-weight="800">Which Route Should Sellers Choose?</text>
<g transform="translate(150 260)" font-family="Arial">
<rect width="390" height="210" rx="28" fill="#0c5da5" opacity=".42" stroke="#69b9ff"/>
<text x="32" y="47" fill="#fff" font-size="28" font-weight="800">AUCTION</text>
<text x="32" y="86" fill="#d8ebf8" font-size="18">£0 seller listing fee</text>
