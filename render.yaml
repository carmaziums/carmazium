services:
  - type: web
    name: carmazium-backend
    env: node
    plan: free
    repo: https://github.com/pizn-01/carmazium
    branch: main
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && npx prisma db push
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Required: Set these in Render Dashboard (Settings > Environment)
      # - SUPABASE_URL: Your Supabase project URL
      # - SUPABASE_JWT_SECRET: From Supabase Dashboard > Settings > API
      # - DATABASE_URL: Prisma connection string
    autoDeploy: true
