app = 'carmazium-hjoh9w'
primary_region = 'lhr'
kill_signal = 'SIGTERM'
kill_timeout = 30

[build]

[deploy]
  # NO release_command on purpose.
  #
  # This used to run `prisma db push --accept-data-loss`, which drops any table
  # present in the database but absent from schema.prisma. The tradexchange_*
  # tables and migrations were historically split between Prisma and Supabase.
  # Finance/Warranty service leads are now modelled in schema.prisma, but the
  # wider production Prisma migration history is still incomplete, so enabling
  # automatic schema reconciliation here would be unsafe. The 2026-09-10 deploy
  # is proof: db push tried destructive cleanup and was stopped
  # only because an RLS policy on tradexchange_offers depended on the table.
  #
  # Schema changes are applied by hand against the database (see
  # prisma/migrations/*.sql) before the deploy that needs them, which is how
  # they have actually been shipped. The Dockerfile still runs `prisma
  # generate`, so the client is always built against schema.prisma.
  #
  # If an automated step is ever wanted here, it must be `prisma migrate deploy`
  # with a real migration history — never `db push`, which treats the schema
  # file as the whole truth and everything else as garbage to collect.

[http_service]
  internal_port = 8080
  force_https = true

  # CarMazium intentionally runs one API machine until the Socket.IO Redis
  # adapter has REDIS_URL configured. Keep that single machine permanently
  # available instead of allowing proxy autostop decisions to participate in
  # availability of the public API.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'

    # Routing health must describe the API process, not PostgreSQL. A transient
    # database/session-store slowdown must not remove CarMazium's only API
    # machine from Fly Proxy and turn a dependency issue into ECONNRESET /
    # ETIMEDOUT for every Vercel request. /health/ready remains available for
    # explicit dependency monitoring.
    path = '/health/live'
    timeout = '10s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
