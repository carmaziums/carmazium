app = 'carmazium-hjoh9w'
primary_region = 'lhr'

[build]

[deploy]
  # Read-only release gate. This does NOT run db push or mutate the schema.
  # TradeXchange historically shipped some Supabase/manual migrations outside
  # Prisma's migration ledger, so automatic reconciliation remains unsafe until
  # that history is fully reconciled. Instead, every backend release verifies
  # the required TradeXchange tables, columns, indexes and backend-only grants
  # before the new machines are promoted.
  release_command = 'node dist/scripts/verify-tradexchange-schema.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # NOTE: intentionally 1, not higher — the Socket.IO Redis adapter
  # (backend/src/core/adapters/redis-io.adapter.ts) needs REDIS_URL set to
  # sync WebSocket broadcasts (live auction bids) across machines. Without
  # it, running >1 machine means bidders connected to different machines
  # miss each other's real-time updates. Raise this again once Upstash
  # Redis is provisioned and REDIS_URL is set as a Fly secret.
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    timeout = '10s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
