app = 'carmazium-hjoh9w'
primary_region = 'lhr'

[build]

[deploy]
  release_command = "npx -y prisma db push --accept-data-loss --skip-generate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
