app = 'carmazium-hjoh9w'
primary_region = 'lhr'

[build]

[deploy]
  release_command = "npx prisma db push --accept-data-loss"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    timeout = '10s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
