name: SimpleDMS partner dependency security audit
on:
  pull_request:
    paths:
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/src/partner-api/**'
      - '.github/workflows/simpledms-partner-security.yml'
  workflow_dispatch:
jobs:
  backend-production-dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Audit backend runtime dependencies without automatic changes
        working-directory: backend
        run: |
          set +e
          npm audit --omit=dev --json > "$RUNNER_TEMP/simpledms-audit.json"
          status=$?
          set -e
          node -e "const a=require(process.env.RUNNER_TEMP+'/simpledms-audit.json');const v=a.metadata?.vulnerabilities||{};console.log('Production dependency audit: '+JSON.stringify(v)); if((v.high||0)+(v.critical||0)>0)process.exit(1)"
      - name: Preserve full report privately for security review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simpledms-backend-production-dependency-audit
          path: ${{ runner.temp }}/simpledms-audit.json
          retention-days: 7
