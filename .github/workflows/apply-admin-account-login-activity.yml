name: Apply admin account login activity patch

on:
  push:
    branches:
      - fix/admin-account-login-activity
    paths:
      - .github/scripts/apply-admin-account-login-activity.py
      - .github/workflows/apply-admin-account-login-activity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-account-login-activity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact admin account activity edits
        run: python .github/scripts/apply-admin-account-login-activity.py
      - name: Commit admin account activity edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts src/components/dashboard/UserDetailModal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): show real account login activity"
          git push origin HEAD:fix/admin-account-login-activity
