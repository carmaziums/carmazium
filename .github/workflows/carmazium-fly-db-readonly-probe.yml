name: One-time CarMazium Fly database-role inspection (read only)
on:
  push:
    branches:
      - security/carmazium-fly-db-readonly-probe
    paths:
      - .github/workflows/carmazium-fly-db-readonly-probe.yml
permissions:
  contents: read
jobs:
  inspect-live-role:
    if: github.repository == 'carmaziums/carmazium' && github.ref == 'refs/heads/security/carmazium-fly-db-readonly-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Require existing Fly deployment credential without printing it
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo 'Existing Fly token unavailable; aborting without access'; exit 1; }
          test -f backend/scripts/security/runtime-db-identity.js
          node --check backend/scripts/security/runtime-db-identity.js
      - name: Install Fly CLI (does not deploy)
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read the existing backend connection role without exposing its URI
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -eu
          payload="$(base64 -w0 backend/scripts/security/runtime-db-identity.js)"
          # This probe performs exactly one metadata-only SELECT inside an
          # existing VM. No app deploy, secret retrieval or database DDL.
          # The script deliberately sanitises connection errors to code only.
          timeout 80s flyctl ssh console --app carmazium-hjoh9w --region lhr \
            --pty=false --command "sh -lc 'printf %s $payload | base64 -d | node'"
          echo 'Read-only Fly DB identity check completed; verify no secrets appeared above.'
