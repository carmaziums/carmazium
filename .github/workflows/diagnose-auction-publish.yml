name: Diagnose Fly runtime logs

on:
  push:
    branches:
      - diag/auction-publish-runtime-log

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fetch recent production logs
        run: flyctl logs --app carmazium-hjoh9w --no-tail
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
