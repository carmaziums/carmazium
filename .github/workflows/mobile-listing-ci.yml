name: Mobile Listing CI

on:
  pull_request:
    paths:
      - "carmazium app/carmazium app/src/screens/sell/SellCarFlowScreen.tsx"
      - "carmazium app/carmazium app/src/screens/seller/SellerAuctionsScreen.tsx"
      - "carmazium app/carmazium app/src/screens/seller/SellerListingsScreen.tsx"
      - "carmazium app/carmazium app/src/screens/main/PricingScreen.tsx"
      - "carmazium app/carmazium app/src/screens/main/PurchaseFlowScreen.tsx"
      - "carmazium app/carmazium app/src/screens/vehicle/AuctionDetailScreen.tsx"
      - "carmazium app/carmazium app/src/navigation/MainStackNavigator.tsx"
      - "carmazium app/carmazium app/src/components/ImportListingModal.tsx"
      - "carmazium app/carmazium app/src/hooks/useListingFeePayment.ts"
      - "carmazium app/carmazium app/src/constants/pricing.ts"
      - "carmazium app/carmazium app/src/lib/sellerVehicleSpecs.ts"
      - "carmazium app/carmazium app/src/lib/sellWizardStore.ts"
      - "carmazium app/carmazium app/src/lib/nativeSellerDraftReadiness.ts"
      - "carmazium app/carmazium app/src/lib/nativeAuctionDraft.ts"
      - "carmazium app/carmazium app/src/store/authStore.ts"
      - "carmazium app/carmazium app/src/store/watchlistStore.ts"
      - "carmazium app/carmazium app/src/lib/watchlistApi.ts"
      - "carmazium app/carmazium app/src/lib/auctionShortlistApi.ts"
      - "carmazium app/carmazium app/src/screens/main/DealerAuctionShortlistScreen.tsx"
      - "carmazium app/carmazium app/scripts/test-auction-shortlist-state.test.mjs"
      - "carmazium app/carmazium app/scripts/test-seller-vehicle-specs.test.mjs"
      - "carmazium app/carmazium app/src/lib/listingsApi.ts"
      - "carmazium app/carmazium app/src/lib/paymentsApi.ts"
      - "carmazium app/carmazium app/src/lib/storageHelper.ts"
      - "carmazium app/carmazium app/src/lib/vehicleImageMetadata.ts"
      - "carmazium app/carmazium app/src/lib/auctionPricing.ts"
      - "carmazium app/carmazium app/src/lib/valuationApi.ts"
      - ".github/workflows/mobile-listing-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "carmazium app/carmazium app"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "carmazium app/carmazium app/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Native seller gearbox and body-type regression suite
        run: npm run test:seller-specs

      - name: Native saved-auction watchlist runtime regressions
        run: node --test scripts/test-auction-shortlist-state.test.mjs

      - name: Typecheck mobile listing surfaces
        shell: bash
        run: |
          set +e
          OUTPUT="$(npm run typescript 2>&1)"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          LISTING_ERRORS="$(printf '%s\n' "$OUTPUT" | grep -E 'src/(store/authStore|screens/(sell/SellCarFlowScreen|seller/(SellerAuctionsScreen|SellerListingsScreen)|main/(PricingScreen|PurchaseFlowScreen)|vehicle/AuctionDetailScreen)|navigation/MainStackNavigator|components/ImportListingModal|hooks/useListingFeePayment|constants/pricing|lib/(nativeAuctionDraft|nativeSellerDraftReadiness|sellWizardStore|sellerVehicleSpecs|listingsApi|paymentsApi|storageHelper|vehicleImageMetadata|auctionPricing|valuationApi))\.tsx?' || true)"
          if [ -n "$LISTING_ERRORS" ]; then
            echo
            echo "TypeScript errors were found in mobile listing/auction files changed by this PR:"
            printf '%s\n' "$LISTING_ERRORS"
            exit 1
          fi

          echo
          echo "Full mobile TypeScript has pre-existing errors outside the listing scope."
          echo "No TypeScript errors were reported in the mobile listing/auction files changed by this PR."
