name: Mobile Listing CI

on:
  pull_request:
    paths:
      - "carmazium app/carmazium app/src/screens/sell/SellCarFlowScreen.tsx"
      - "scripts/test-native-web-vehicle-parity-20261015.test.mjs"
      - "carmazium app/carmazium app/src/screens/seller/SellerAuctionsScreen.tsx"
      - "carmazium app/carmazium app/src/screens/seller/SellerListingsScreen.tsx"
      - "carmazium app/carmazium app/src/screens/main/PricingScreen.tsx"
      - "carmazium app/carmazium app/src/screens/main/PurchaseFlowScreen.tsx"
      - "carmazium app/carmazium app/src/screens/vehicle/AuctionDetailScreen.tsx"
      - "carmazium app/carmazium app/src/navigation/MainStackNavigator.tsx"
      - "carmazium app/carmazium app/src/components/ImportListingModal.tsx"
      - "carmazium app/carmazium app/src/hooks/useListingFeePayment.ts"
      - "carmazium app/carmazium app/src/constants/pricing.ts"
      - "carmazium app/carmazium app/src/lib/sellerVehicleSpecs.ts"
      - "carmazium app/carmazium app/src/lib/sellWizardStore.ts"
      - "carmazium app/carmazium app/src/lib/nativeSellerDraftReadiness.ts"
      - "carmazium app/carmazium app/src/lib/sellerFaultDeclaration.ts"
      - "carmazium app/carmazium app/src/lib/nativeAuctionDraft.ts"
      - "carmazium app/carmazium app/src/store/authStore.ts"
      - "carmazium app/carmazium app/scripts/test-seller-vehicle-specs.test.mjs"
      - "carmazium app/carmazium app/src/lib/listingsApi.ts"
      - "carmazium app/carmazium app/src/data/listings.ts"
      - "carmazium app/carmazium app/src/components/VehicleCard.tsx"
      - "carmazium app/carmazium app/src/components/HorizontalVehicleCard.tsx"
      - "carmazium app/carmazium app/src/screens/main/SearchScreen.tsx"
      - "carmazium app/carmazium app/src/screens/main/DealerLeadsScreen.tsx"
      - "carmazium app/carmazium app/src/screens/main/DealerPurchasesScreen.tsx"
      - "carmazium app/carmazium app/src/screens/main/ProviderJobsScreen.tsx"
      - "scripts/test-dealer-purchase-destinations.test.mjs"
      - "carmazium app/carmazium app/src/screens/account/MyCarsScreen.tsx"
      - "carmazium app/carmazium app/scripts/test-personal-cars-purchases-mobile.test.mjs"
      - "scripts/test-ios-compact-dashboard-and-posted-jobs.test.mjs"
      - "carmazium app/carmazium app/src/lib/paymentsApi.ts"
      - "carmazium app/carmazium app/src/lib/storageHelper.ts"
      - "carmazium app/carmazium app/src/lib/vehicleImageMetadata.ts"
      - "carmazium app/carmazium app/src/lib/auctionPricing.ts"
      - "carmazium app/carmazium app/src/lib/valuationApi.ts"
      - "carmazium app/carmazium app/src/lib/appUpdater.ts"
      - "carmazium app/carmazium app/src/components/AppUpdatePrompt.tsx"
      - "carmazium app/carmazium app/src/components/AndroidUpdateSettings.tsx"
      - "carmazium app/carmazium app/App.tsx"
      - "carmazium app/carmazium app/scripts/test-settings-mobile-profile-fields.test.mjs"
      - "carmazium app/carmazium app/src/screens/main/SettingsScreen.tsx"
      - "carmazium app/carmazium app/src/screens/main/ProviderOverviewScreen.tsx"
      - "carmazium app/carmazium app/src/screens/main/ServicesScreen.tsx"
      - "carmazium app/carmazium app/src/lib/nativeContentLinks.ts"
      - "carmazium app/carmazium app/assets/images/live-auction-hero.webp"
      - "carmazium app/carmazium app/scripts/test-tradexchange-directory-parity.test.mjs"
      - "carmazium app/carmazium app/src/screens/main/CustomerServiceJobDetailScreen.tsx"
      - "carmazium app/carmazium app/src/lib/serviceJobJourney.ts"
      - "carmazium app/carmazium app/src/lib/servicesApi.ts"
      - "carmazium app/carmazium app/src/components/ServiceJobChanges.tsx"
      - "carmazium app/carmazium app/scripts/test-customer-service-lifecycle.test.mjs"
      - "carmazium app/carmazium app/scripts/test-partner-service-parity.test.mjs"
      - "carmazium app/carmazium app/src/screens/main/CreateServiceJobScreen.tsx"
      - "carmazium app/carmazium app/app.json"
      - "carmazium app/carmazium app/scripts/test-app-updater.test.mjs"
      - "carmazium app/carmazium app/scripts/test-app-update-prompt.test.mjs"
      - "carmazium app/carmazium app/src/components/SiteMenu.tsx"
      - "carmazium app/carmazium app/scripts/test-site-menu-auction.test.mjs"
      - ".github/workflows/mobile-listing-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "carmazium app/carmazium app"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "carmazium app/carmazium app/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Native seller gearbox and body-type regression suite
        run: npm run test:seller-specs

      - name: Dashboard customisation and native service flows
        run: node --test scripts/test-dashboard-cards.test.mjs scripts/test-web-dashboard-cards.test.mjs scripts/test-native-service-completion.test.mjs scripts/test-partner-service-parity.test.mjs scripts/test-customer-service-lifecycle.test.mjs scripts/test-tradexchange-directory-parity.test.mjs scripts/test-tradexchange-entry-links.test.mjs

      - name: Original Android update and TradeXchange menu navigation
        run: node --test scripts/test-app-updater.test.mjs scripts/test-app-update-prompt.test.mjs scripts/test-site-menu-auction.test.mjs

      - name: Mobile dealer CRM and iPhone responsive layouts
        run: node ../../scripts/test-ios-compact-dashboard-and-posted-jobs.test.mjs

      - name: Personal My Cars and buyer purchase native flows
        run: node --test scripts/test-personal-cars-purchases-mobile.test.mjs

      - name: Native Account Settings and Android updates
        run: node --test scripts/test-settings-mobile-profile-fields.test.mjs

      - name: Native DVLA, 3D and dual-price parity regressions
        run: node ../../scripts/test-native-web-vehicle-parity-20261015.test.mjs

      - name: Typecheck mobile listing surfaces
        shell: bash
        run: |
          set +e
          OUTPUT="$(npm run typescript 2>&1)"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          LISTING_ERRORS="$(printf '%s\n' "$OUTPUT" | grep -E 'src/(store/authStore|screens/(sell/SellCarFlowScreen|seller/(SellerAuctionsScreen|SellerListingsScreen)|main/(PricingScreen|PurchaseFlowScreen)|vehicle/AuctionDetailScreen)|navigation/MainStackNavigator|components/ImportListingModal|hooks/useListingFeePayment|constants/pricing|lib/(nativeAuctionDraft|nativeSellerDraftReadiness|sellWizardStore|sellerVehicleSpecs|listingsApi|paymentsApi|storageHelper|vehicleImageMetadata|auctionPricing|valuationApi))\.tsx?' || true)"
          # This PR also changes Android update checks and iPhone native UI.
          # Pre-existing unrelated errors must not mask a new broken release.
          PARITY_ERRORS="$(printf '%s\n' "$OUTPUT" | grep -E '(App\.tsx|src/(lib/appUpdater|components/(AppUpdatePrompt|AndroidUpdateSettings)|screens/main/(SettingsScreen|ProviderOverviewScreen|CreateServiceJobScreen))\.tsx?)' || true)"
          if [ -n "$LISTING_ERRORS" ] || [ -n "$PARITY_ERRORS" ]; then
            echo
            echo "TypeScript errors were found in the affected mobile sources:"
            printf '%s\n' "$LISTING_ERRORS"
            printf '%s\n' "$PARITY_ERRORS"
            exit 1
          fi

          echo
          echo "Full mobile TypeScript has pre-existing errors outside the listing scope."
          echo "No TypeScript errors were reported in the mobile listing/auction files changed by this PR."
