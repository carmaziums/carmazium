name: Web Listing CI

on:
  pull_request:
    paths:
      - "src/components/listing/**"
      - "src/app/auctions/live/**"
      - "src/app/vehicle/**"
      - "src/app/buy-cars/**"
      - "src/lib/damageMarkers.ts"
      - "scripts/test-public-damage-pins.test.mjs"
      - "scripts/test-web-damage-release.test.mjs"
      - "src/components/features/ImportListingModal.tsx"
      - "src/components/dashboard/ListingEditModal.tsx"
      - "src/components/admin/AdminVehicleReviewPanel.tsx"
      - "src/app/dashboard/admin/listings/page.tsx"
      - "src/lib/adminVehicleReview.ts"
      - "src/lib/adminApi.ts"
      - "scripts/test-admin-vehicle-review.test.mjs"
      - "scripts/test-official-vehicle-field-parity.test.mjs"
      - "src/app/pricing/**"
      - "src/app/dashboard/seller/auctions/**"
      - "src/app/dashboard/dealer/inventory/**"
      - "src/lib/listingApi.ts"
      - "src/app/HomeClient.tsx"
      - "src/app/dashboard/dealer/purchases/**"
      - "src/app/dashboard/dealer/auctions/won/page.tsx"
      - "src/components/dealer/PipelineRow.tsx"
      - "src/lib/dealerPurchaseDetail.ts"
      - "scripts/test-dealer-purchase-detail.test.mjs"
      - "src/components/dealer/BuyAndBidTabs.tsx"
      - "src/lib/pendingRetailPurchases.ts"
      - "scripts/test-dealer-pending-retail-purchases.test.mjs"
      - "src/app/page.tsx"
      - "src/components/features/CarCard.tsx"
      - "src/lib/vehicleLabels.ts"
      - "src/app/search/page.tsx"
      - "scripts/test-retail-card-transmission.test.mjs"
      - "scripts/test-home-retail-inventory-truth.test.mjs"
      - "src/lib/googleAds.ts"
      - "src/lib/gtm.ts"
      - "src/app/checkout/success/page.tsx"
      - "scripts/test-google-ads-qualified-seller.test.mjs"
      - "src/lib/dvlaApi.ts"
      - "src/lib/apiClient.ts"
      - "src/lib/fetchWithRetry.ts"
      - "scripts/test-dvla-retail-lookup.test.mjs"
      - "src/lib/sellerVehicleSpecs.ts"
      - "src/lib/pendingSellerHandoff.ts"
      - "src/lib/sellerDraftIsolation.ts"
      - "src/lib/sellerDeclarationValidation.ts"
      - "src/lib/sellerAuctionDraft.ts"
      - "scripts/test-seller-vehicle-specs.test.mjs"
      - "scripts/test-mazium-description.test.mjs"
      - "scripts/test-buyer-mot-display.test.mjs"
      - "src/lib/pricingConfig.ts"
      - "src/lib/auctionApi.ts"
      - "src/lib/auctionPricing.ts"
      - ".github/workflows/web-listing-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seller gearbox and body-type regression tests
        run: npm run test:seller-specs

      - name: Retail and auction DVLA timeout regression tests
        run: node --test scripts/test-dvla-retail-lookup.test.mjs

      - name: MaziuM description contrast and mobile overflow regressions
        run: node --test scripts/test-mazium-description.test.mjs

      - name: Qualified seller Google Ads tracking regression suite
        run: node --test scripts/test-google-ads-qualified-seller.test.mjs

      - name: Verify 3D damage upload, buyer evidence and safe navigation
        run: node --test scripts/test-web-damage-release.test.mjs

      - name: Verify exact and approximate damage marker mapping for auction and retail
        run: node --test scripts/test-public-damage-pins.test.mjs

      - name: Verify buyer DVLA and MOT information for both auction and retail
        run: node --test scripts/test-buyer-mot-display.test.mjs

      - name: Verify retail transmission badges and all card data paths
        run: node --test scripts/test-retail-card-transmission.test.mjs

      - name: Verify secure dealer purchase detail web and native parity
        run: node --test scripts/test-dealer-purchase-detail.test.mjs

      - name: Verify accepted retail purchases appear without premature completed-sale records
        run: node --test scripts/test-dealer-pending-retail-purchases.test.mjs

      - name: Verify homepage live inventory and honest photo/payment presentation
        run: node --test scripts/test-home-retail-inventory-truth.test.mjs

      - name: Verify admin-only review and dual-channel official data preservation
        run: node --test scripts/test-admin-vehicle-review.test.mjs

      - name: Verify DVLA and MOT field integrity across web, app and backend
        run: node --test scripts/test-official-vehicle-field-parity.test.mjs

      - name: Typecheck web listing surfaces
        shell: bash
        run: |
          set +e
          OUTPUT="$(npx tsc --noEmit --pretty false 2>&1)"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          LISTING_ERRORS="$(printf '%s\n' "$OUTPUT" | grep -E '^src/(components/(listing/|features/ImportListingModal\.tsx|dashboard/ListingEditModal\.tsx)|app/(pricing/|dashboard/(seller/auctions/|dealer/inventory/))|lib/(listingApi|pricingConfig|auctionApi|auctionPricing|sellerVehicleSpecs|pendingSellerHandoff|sellerDraftIsolation|sellerDeclarationValidation|sellerAuctionDraft|googleAds|gtm|dvlaApi|apiClient|fetchWithRetry)\.ts)|^src/app/checkout/success/page\.tsx' || true)"

          if [ -n "$LISTING_ERRORS" ]; then
            echo
            echo "TypeScript errors were found in web listing/auction surfaces:"
            printf '%s\n' "$LISTING_ERRORS"
            exit 1
          fi

          echo
          echo "The full web TypeScript project has pre-existing errors outside the listing scope."
          echo "No TypeScript errors were reported in web listing/auction files covered by this workflow."

      - name: Build web app
        run: npm run build
