name: CarMazium iPhone store screenshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/carmazium-ios-store-screenshots.yml'
permissions:
  contents: read
concurrency:
  group: ios-store-screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      APP_ENV: production
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      # Exact merged source, including the validated non-VAT company correction.
      SOURCE_SHA: cb26225d3196ca4e14708f53f1de0c6f8858e4f5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb26225d3196ca4e14708f53f1de0c6f8858e4f5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify source and stage the original app without spaces in its path
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor HEAD origin/main
          mkdir -p "$RUNNER_TEMP/carmazium-screenshots" "$RUNNER_TEMP/screenshot-evidence"
          git archive HEAD 'carmazium app/carmazium app' | tar -x -C "$RUNNER_TEMP/screenshot-evidence"
          rsync -a "$RUNNER_TEMP/screenshot-evidence/carmazium app/carmazium app/" "$RUNNER_TEMP/carmazium-screenshots/"
          cd "$RUNNER_TEMP/carmazium-screenshots"
          node - <<'NODE'
          const fs = require('fs');
          const app = require('./app.json').expo;
          const env = require('./eas.json').build.production.env;
          if (app.ios.bundleIdentifier !== 'uk.carmazium.app' ||
              app.owner !== 'carmazium' || app.version !== '1.0.2' ||
              app.extra.eas.projectId !== '9c77bb81-205c-42f8-913e-b69a0953ec10') {
            throw new Error('Original iOS identity or version mismatch');
          }
          // Match the original app's public production configuration. No credentials.
          for (const [key, value] of Object.entries(env)) {
            if (!(key === 'APP_ENV' || key.startsWith('EXPO_PUBLIC_'))) continue;
            if (/[\r\n]/.test(String(value))) throw new Error('Multiline environment value');
            fs.appendFileSync(process.env.GITHUB_ENV, key + '=' + value + '\n');
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + '/screenshot-evidence/provenance.json',
            JSON.stringify({sourceSha: process.env.SOURCE_SHA, appVersion: app.version,
              bundleId: app.ios.bundleIdentifier, purpose: 'Native iPhone simulator screenshots; not a signed release or physical-device acceptance'}, null, 2));
          NODE
      - name: Install locked dependencies and check the native app
        working-directory: ${{ runner.temp }}/carmazium-screenshots
        run: |
          npm ci
          npm run typescript
          npm audit --omit=dev --audit-level=critical
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned UI automation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo '54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  '"$RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        id: simulator-cache
        with:
          path: ${{ runner.temp }}/carmazium-simulator
          key: ios-store-sim-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_SHA }}
      - name: Generate iOS project and build Release for the simulator
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/carmazium-screenshots
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --clean --no-install
          (cd ios && pod install)
          xcodebuild -workspace ios/CarMazium.xcworkspace -scheme CarMazium \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/carmazium-derived" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" build > "$RUNNER_TEMP/screenshot-evidence/xcodebuild.log" 2>&1
          mkdir -p "$RUNNER_TEMP/carmazium-simulator"
          cp -R "$RUNNER_TEMP/carmazium-derived/Build/Products/Release-iphonesimulator/CarMazium.app" "$RUNNER_TEMP/carmazium-simulator/"
          printf '%s' "$SOURCE_SHA" > "$RUNNER_TEMP/carmazium-simulator/source-sha.txt"
      - uses: actions/cache/save@v4
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/carmazium-simulator
          key: ios-store-sim-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_SHA }}
      - name: Capture the running iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/screenshot-evidence/devices.json"
          for SIZE in medium large; do
          export SCREENSHOT_SIZE="$SIZE"
          DEVICE_ID=$(node - <<'NODE'
          const fs = require('fs');
          const all = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/screenshot-evidence/devices.json'));
          const devices = Object.values(all.devices).flat();
          const suffix = process.env.SCREENSHOT_SIZE === 'medium' ? 'Pro' : 'Pro Max';
          const device = devices.find(d => d.name === 'iPhone 16 ' + suffix) ||
                         devices.find(d => d.name === 'iPhone 17 ' + suffix);
          if (!device) throw new Error('Required iPhone simulator is unavailable');
          console.log(device.udid);
          NODE
          )
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          APP="$RUNNER_TEMP/carmazium-simulator/CarMazium.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'uk.carmazium.app'
          test "$(cat "$RUNNER_TEMP/carmazium-simulator/source-sha.txt")" = "$SOURCE_SHA"
          xcrun simctl install "$DEVICE_ID" "$APP"
          mkdir -p "$RUNNER_TEMP/screenshot-evidence/screenshots/$SIZE"
          cat > "$RUNNER_TEMP/home.yaml" <<'FLOW'
          appId: uk.carmazium.app
          ---
          - launchApp
          - extendedWaitUntil:
              visible: SKIP
              timeout: 60000
          - tapOn: SKIP
          - extendedWaitUntil:
              visible: Home
              timeout: 60000
          - runFlow:
              when:
                visible: Not now
              commands:
                - tapOn: Not now
          - assertNotVisible: GET STARTED
          - waitForAnimationToEnd
          FLOW
          maestro --device "$DEVICE_ID" test --test-output-dir "$RUNNER_TEMP/screenshot-evidence/maestro/$SIZE/home" "$RUNNER_TEMP/home.yaml"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/screenshot-evidence/screenshots/$SIZE/01-home.png"
          # Public retail browsing does not require dealer credentials.
          cat > "$RUNNER_TEMP/retail.yaml" <<'FLOW'
          appId: uk.carmazium.app
          ---
          - tapOn: Buy Cars
          - extendedWaitUntil:
              visible: Find Your Perfect Car
              timeout: 60000
          - extendedWaitUntil:
              visible: "Showing 1.*vehicles"
              timeout: 60000
          - assertNotVisible: Unable to load vehicles
          - waitForAnimationToEnd
          FLOW
          maestro --device "$DEVICE_ID" test --test-output-dir "$RUNNER_TEMP/screenshot-evidence/maestro/$SIZE/retail" "$RUNNER_TEMP/retail.yaml"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/screenshot-evidence/screenshots/$SIZE/02-retail.png"
          cat > "$RUNNER_TEMP/services.yaml" <<'FLOW'
          appId: uk.carmazium.app
          ---
          - openLink: carmazium://services
          - runFlow:
              when:
                visible: Open
              commands:
                - tapOn: Open
          - extendedWaitUntil:
              visible: Everything your vehicle needs. One marketplace.
              timeout: 60000
          - assertNotVisible: GET STARTED
          - assertNotVisible: Open
          - waitForAnimationToEnd
          FLOW
          maestro --device "$DEVICE_ID" test --test-output-dir "$RUNNER_TEMP/screenshot-evidence/maestro/$SIZE/services" "$RUNNER_TEMP/services.yaml"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/screenshot-evidence/screenshots/$SIZE/03-services.png"
          xcrun simctl shutdown "$DEVICE_ID"
          done
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/screenshot-evidence/screenshots/"*/*.png
          shasum -a 256 "$RUNNER_TEMP/screenshot-evidence/screenshots/"*/*.png > "$RUNNER_TEMP/screenshot-evidence/screenshots.sha256"
      - name: Save screenshots and build evidence for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarMazium-iOS-current-native-screenshots
          path: |
            ${{ runner.temp }}/screenshot-evidence/screenshots/
            ${{ runner.temp }}/screenshot-evidence/maestro/
            ${{ runner.temp }}/screenshot-evidence/provenance.json
            ${{ runner.temp }}/screenshot-evidence/screenshots.sha256
            ${{ runner.temp }}/screenshot-evidence/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
