name: One Product Parity

on:
  pull_request:
    paths:
      - 'src/**'
      - 'backend/src/**'
      - 'backend/prisma/**'
      - 'carmazium app/carmazium app/src/**'
      - 'carmazium app/carmazium app/assets/**'
      - 'carmazium app/carmazium app/app.json'
      - 'carmazium app/carmazium app/plugins/**'
      - 'next.config.ts'
      - 'product-parity.json'
      - 'scripts/check-product-parity.mjs'
      - 'scripts/test-native-damage-surface-tap-block1.test.mjs'
      - 'scripts/test-native-damage-inline-editor-block2.test.mjs'
      - 'scripts/test-native-damage-camera-preview-block3.test.mjs'
      - 'scripts/test-native-damage-durable-upload-block4.test.mjs'
      - 'scripts/test-native-damage-multiple-pins-block5.test.mjs'
      - 'scripts/test-native-damage-draft-recovery-block6.test.mjs'
      - 'scripts/test-native-damage-pin-visibility-block7.test.mjs'
      - 'scripts/test-damage-web-buyer-parity-block8.test.mjs'
      - 'scripts/test-damage-accessibility-gesture-block9.test.mjs'
      - 'scripts/test-damage-block10-security-release-gates.test.mjs'
      - 'scripts/test-native-simplified-main-menu.test.mjs'
      - '.github/workflows/product-parity.yml'

jobs:
  parity-contract:
    name: Product contract parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check web/mobile/backend business-rule parity
        run: node scripts/check-product-parity.mjs
      - name: Verify authoritative auction buyer-fee deadline parity
        run: node scripts/check-auction-fee-deadline.mjs
      - name: Assert exact native and web MaziuM visual parity
        run: node --test scripts/test-mazium-native-visual-parity.test.mjs
      - name: Assert seller-only 3D surface hit and touch-versus-drag contract
        run: node --test scripts/test-native-damage-surface-tap-block1.test.mjs
      - name: Block 2 — validate fast inline damage editor, panel correction and optional area list
        run: node --test scripts/test-native-damage-inline-editor-block2.test.mjs
      - name: Block 3 — camera/gallery previews, per-damage staging and safe Save & Add Another
        run: node --test scripts/test-native-damage-camera-preview-block3.test.mjs
      - name: Block 4 — verify durable per-defect photo upload, retry and publish guards
        run: node --test scripts/test-native-damage-durable-upload-block4.test.mjs
      - name: Block 5 — numbered 3D damage pins, independent records and stable coordinates
        run: node --test scripts/test-native-damage-multiple-pins-block5.test.mjs
      - name: Block 6 — verify damage draft recovery, photo references and cleanup safeguards
        run: node --test scripts/test-native-damage-draft-recovery-block6.test.mjs
      - name: Block 7 — camera-following damage pins, collision visibility and grade summary
        run: node --test scripts/test-native-damage-pin-visibility-block7.test.mjs
      - name: Block 8 — website seller and buyer 3D annotation/evidence parity
        run: node --test scripts/test-damage-web-buyer-parity-block8.test.mjs
      - name: Block 9 — screen-reader navigation, dense pins and small-screen gesture safety
        run: node --test scripts/test-damage-accessibility-gesture-block9.test.mjs
      - name: Block 10 — validate damage ownership and private Android release gates
        run: node --test scripts/test-damage-block10-security-release-gates.test.mjs
      - name: Simplified main menu — verify navigation and settings account consolidation
        run: node --test scripts/test-native-simplified-main-menu.test.mjs
      - name: Verify prior shared header, dealer tabs and unified settings still work
        run: node --test scripts/test-native-website-ui-parity.test.mjs scripts/test-unified-account-settings.test.mjs

  web-typecheck:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/check-auction-seller-sequencing.mjs
      - name: Auction shortlist web regressions
        run: node --test scripts/test-auction-shortlist.test.mjs
      - run: npx tsc --noEmit

  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'carmazium app/carmazium app'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'carmazium app/carmazium app/package-lock.json'
      - run: npm ci
      - run: npm run typescript

  backend-typecheck:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test self-service account role boundary
        run: npm test -- --runInBand src/core/account-roles.spec.ts
      - name: Test dealer-only saved auction shortlist
        run: npm test -- --runInBand src/watchlist/watchlist.service.spec.ts
      - name: Verify same-panel damage rows retain independent IDs and positions
        run: npm test -- --runInBand src/damage/damage.service.spec.ts
      - name: Reject cross-seller damage writes, foreign photos and private draft reads
        run: npm test -- --runInBand src/damage/damage.security.spec.ts
      - name: Validate cookie-vs-cached-user identity for damage controller
        run: npm test -- --runInBand src/damage/damage.controller.spec.ts
