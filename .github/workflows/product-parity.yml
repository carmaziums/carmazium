name: One Product Parity

on:
  pull_request:
    paths:
      - 'src/**'
      - 'backend/src/**'
      - 'backend/prisma/**'
      - 'carmazium app/carmazium app/src/**'
      - 'carmazium app/carmazium app/App.tsx'
      - 'carmazium app/carmazium app/scripts/test-password-recovery-parity.test.mjs'
      - 'carmazium app/carmazium app/scripts/test-dealer-invite-link.test.mjs'
      - 'carmazium app/carmazium app/scripts/test-staff-invite-parity.test.mjs'
      - 'carmazium app/carmazium app/assets/**'
      - 'carmazium app/carmazium app/app.json'
      - 'carmazium app/carmazium app/plugins/**'
      - 'next.config.ts'
      - 'product-parity.json'
      - 'scripts/check-product-parity.mjs'
      - '.github/workflows/product-parity.yml'

jobs:
  parity-contract:
    name: Product contract parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check web/mobile/backend business-rule parity
        run: node scripts/check-product-parity.mjs
      - name: Verify authoritative auction buyer-fee deadline parity
        run: node scripts/check-auction-fee-deadline.mjs
      - name: Assert exact native and web MaziuM visual parity
        run: node --test scripts/test-mazium-native-visual-parity.test.mjs

  web-typecheck:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/check-auction-seller-sequencing.mjs
      - name: Auction shortlist web regressions
        run: node --test scripts/test-auction-shortlist.test.mjs
      - run: npx tsc --noEmit

  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'carmazium app/carmazium app'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'carmazium app/carmazium app/package-lock.json'
      - run: npm ci
      - run: npm run typescript
      - name: Native recovery-link and session-isolation regressions
        run: node --test scripts/test-password-recovery-parity.test.mjs
      - name: Signed-out dealership invitation deferral regressions
        run: node --test scripts/test-dealer-invite-link.test.mjs
      - name: Native and website onboarding and staff-invite parity regressions
        run: node --test scripts/test-staff-invite-parity.test.mjs

  backend-typecheck:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test self-service account role boundary
        run: npm test -- --runInBand src/core/account-roles.spec.ts
      - name: Test dealer-only saved auction shortlist
        run: npm test -- --runInBand src/watchlist/watchlist.service.spec.ts
