name: One Product Parity

on:
  pull_request:
    paths:
      - 'src/**'
      - 'backend/src/**'
      - 'backend/prisma/**'
      - 'carmazium app/carmazium app/src/**'
      - 'carmazium app/carmazium app/assets/**'
      - 'carmazium app/carmazium app/app.json'
      - 'carmazium app/carmazium app/plugins/**'
      - 'next.config.ts'
      - 'product-parity.json'
      - 'scripts/check-product-parity.mjs'
      - 'scripts/test-native-delivery-fee-truth.test.mjs'
      - '.github/workflows/product-parity.yml'

jobs:
  parity-contract:
    name: Product contract parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check web/mobile/backend business-rule parity
        run: node scripts/check-product-parity.mjs
      - name: Verify vehicle catalogue and filter parity across web, backend and native
        run: node --test scripts/test-vehicle-search-catalog.test.mjs
      - name: Verify authoritative auction buyer-fee deadline parity
        run: node scripts/check-auction-fee-deadline.mjs
      - name: Assert exact native and web MaziuM visual parity
        run: node --test scripts/test-mazium-native-visual-parity.test.mjs

  web-typecheck:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/check-auction-seller-sequencing.mjs
      - name: Verify app installation buttons, links and release gating
        run: node --test scripts/test-website-mobile-app-downloads.test.mjs
      - name: Verify consistent compact homepage app marketing
        run: node --test scripts/test-home-app-promo-compact.test.mjs
      - name: Verify deleted accounts can re-register and are not shown as bans
        run: node --test scripts/test-account-reregistration.test.mjs
      - name: Verify chat fits a phone screen on every Messages page
        run: node --test scripts/test-chat-mobile-width.test.mjs
      - name: Verify native seller delivery fee information is factual
        run: node --test scripts/test-native-delivery-fee-truth.test.mjs
      - name: Verify retired pages redirect and the dead newsletter form is gone
        run: node --test scripts/test-retired-page-redirects.test.mjs
      - name: Verify website audit fixes (images, SEO metadata, dead buttons, copy)
        run: node --test scripts/test-website-audit-20261031.test.mjs
      - name: Verify hero headline stays visible before hydration
        run: node --test scripts/test-home-hero-visibility.test.mjs
      - name: Verify search cards defer gallery photos until swipe
        run: node --test scripts/test-card-image-initial-cover-only.test.mjs
      - name: Verify administrator-only dashboard navigation and customer onboarding isolation
        run: node --test scripts/test-admin-exclusive-dashboard-routing.test.mjs
      - name: Verify admin Analytics mobile, UK dates, light/dark semantics and error labels
        run: node --test scripts/test-admin-analytics-mobile-qa.test.mjs
      - name: Verify desktop dealer login cannot stall on Supabase auth callbacks
        run: node --test scripts/test-desktop-dealer-auth-loading.test.mjs
      - name: Verify login profile recovery cannot get trapped on a spinner
        run: node --test scripts/test-login-profile-recovery.test.mjs
      - name: Verify seller and buyer website damage evidence contract
        run: node --test scripts/test-web-damage-release.test.mjs
      - name: Auction shortlist web regressions
        run: node --test scripts/test-auction-shortlist.test.mjs
      - run: npx tsc --noEmit

  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'carmazium app/carmazium app'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'carmazium app/carmazium app/package-lock.json'
      - run: npm ci
      - run: npm run typescript

  backend-typecheck:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test self-service account role boundary
        run: npm test -- --runInBand src/core/account-roles.spec.ts
      - name: Test dealer-only saved auction shortlist
        run: npm test -- --runInBand src/watchlist/watchlist.service.spec.ts
      - name: Test retail and dealer auction valuation price policy
        run: npm test -- --runInBand src/listings/vehicle-valuation.spec.ts
