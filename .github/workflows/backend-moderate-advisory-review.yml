name: Independent Backend Moderate Advisory Inventory

on:
  pull_request:
    branches: [security-backend-prisma6-config-advisory-20261003]
    paths:
      - '.github/workflows/backend-moderate-advisory-review.yml'
      - 'backend/scripts/security-moderate-advisory-report.cjs'
      - 'backend/package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moderate-dependency-inventory:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'security-backend-moderate-advisory-review-20261003')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check exact original backend audit with unchanged lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          before="$(mktemp)"
          (cd backend && npm audit --package-lock-only --omit=dev --json > "$before") || true
          node backend/scripts/security-moderate-advisory-report.cjs "$before" before
          rm -f "$before"
      - name: Simulate compatible dependency fixes, without force, on disposable CI runner only
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-fund \
            > /tmp/moderate-fix-simulation.log 2>&1) || true
          after="$(mktemp)"
          (cd backend && npm audit --package-lock-only --omit=dev --json > "$after") || true
          node backend/scripts/security-moderate-advisory-report.cjs "$after" after-simulation
          echo 'SIMULATED_MODERATE_FIX_DIFF'
          git diff --numstat -- backend/package-lock.json backend/package.json
          echo 'No simulated lockfile is committed, uploaded or deployed.'
          rm -f "$after"
