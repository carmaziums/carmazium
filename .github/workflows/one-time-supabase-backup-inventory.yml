name: One-time managed Supabase backup inventory (read-only)
on:
  push:
    branches: [security/one-time-managed-backup-inventory]
    paths: ['.github/workflows/one-time-supabase-backup-inventory.yml']
permissions:
  contents: read
jobs:
  scheduled-backup-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query provider backup inventory only if an existing Management API token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const token=process.env.SUPABASE_ACCESS_TOKEN;
            if(!token){
              console.log('MANAGED_BACKUP_STATUS: UNVERIFIED_NO_EXISTING_MANAGEMENT_TOKEN');
              return;
            }
            const url='https://api.supabase.com/v1/projects/bwtnzmevjlowwronylxm/database/backups';
            let response;
            try {
              response=await fetch(url,{
                method:'GET',
                headers:{'Authorization':'Bearer '+token,'Accept':'application/json'},
                redirect:'error',
                signal:AbortSignal.timeout(15000)
              });
            } catch {
              console.log('MANAGED_BACKUP_STATUS: UNVERIFIED_PROVIDER_REQUEST_FAILED');
              process.exitCode=1;
              return;
            }
            console.log('MANAGED_BACKUP_API_HTTP_STATUS: '+response.status);
            if(!response.ok){
              console.log('MANAGED_BACKUP_STATUS: UNVERIFIED_PROVIDER_REJECTED_READ_ONLY_REQUEST');
              return;
            }
            let result;
            try{result=await response.json()}
            catch{
              console.log('MANAGED_BACKUP_STATUS: UNVERIFIED_UNREADABLE_PROVIDER_RESULT');
              process.exitCode=1;return;
            }
            // Never print provider response, project secrets, paths, restore
            // tokens or private backup URIs. Only limited status/counts.
            const candidates=[result?.backups,result?.scheduled_backups,
              result?.daily_backups,result?.data?.backups,
              result?.data?.scheduled_backups,
              Array.isArray(result)?result:undefined].filter(Array.isArray);
            const backups=candidates[0];
            const pitr=!!(result?.pitr_enabled??result?.pitr?.enabled);
            if(!backups){
              console.log('MANAGED_BACKUP_STATUS: UNVERIFIED_UNKNOWN_RESPONSE_SHAPE');
              console.log('MANAGED_BACKUP_TOP_LEVEL_FIELDS: '+
                Object.keys(result||{}).filter(x=>/backup|pitr|schedule|status/i.test(x)).join(','));
              return;
            }
            console.log('MANAGED_BACKUP_INVENTORY_COUNT: '+backups.length);
            const timestamps=[];
            let flaggedComplete=0;
            for(const backup of backups){
              const status=String(backup?.status||backup?.state||'').toUpperCase();
              if(['COMPLETED','SUCCESS','SUCCESSFUL','READY','AVAILABLE'].includes(status))flaggedComplete++;
              const candidate=backup?.completed_at||backup?.inserted_at||
                backup?.created_at||backup?.timestamp||backup?.started_at;
              if(candidate){
                const d=new Date(typeof candidate==='number' && candidate<1e11?
                  candidate*1000:candidate);
                if(!Number.isNaN(d.getTime()))timestamps.push(d.getTime());
              }
            }
            console.log('MANAGED_BACKUP_COMPLETED_STATUS_COUNT: '+flaggedComplete);
            console.log('MANAGED_BACKUP_LATEST_RECORDED_UTC: '+
              (timestamps.length?new Date(Math.max(...timestamps)).toISOString():'NOT_EXPOSED'));
            console.log('PITR_REPORTED_ENABLED: '+pitr);
            console.log('MANAGED_BACKUP_STATUS: READ_ONLY_LIST_REQUEST_SUCCEEDED');
          })().catch(()=>{
            console.log('MANAGED_BACKUP_STATUS: UNVERIFIED_INTERNAL_READONLY_CHECK');
            process.exitCode=1;
          });
          NODE
