name: One-time owner-approved CarMazium 124 internal candidate request

# User-authorised one-time kickoff, not a customer release.
# The existing candidate workflow retains all certificate, source and APK checks.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/carmazium-one-time-124-candidate-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-candidate:
    if: github.repository == 'carmaziums/carmazium'
    runs-on: ubuntu-latest
    steps:
      - name: Start production-signed internal candidate of the exact main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/carmazium-android-release-candidate.yml/dispatches" \
            -f ref=main \
            -f "inputs[source_sha]=$GITHUB_SHA" \
            -f "inputs[approval]=INTERNAL_REVIEW_ONLY" \
            -f "inputs[version_code]=124"
          echo "Requested signed build 124 for internal device verification only."
          echo "Public APK publication is separately gated and not authorised by this workflow."
