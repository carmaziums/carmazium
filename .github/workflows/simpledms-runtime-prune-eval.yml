name: Evaluate minimal SimpleDMS runtime installation
on:
  push:
    branches:
      - security/simpledms-runtime-prune-eval
    paths:
      - .github/workflows/simpledms-runtime-prune-eval.yml
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/security/simpledms-runtime-prune-eval'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Refresh lockfile for Nest build-only dependency classifications
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Full application test before removal
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand
          npm run build
      - name: Remove dev and optional peer dependencies from runtime
        working-directory: backend
        run: |
          npm prune --omit=dev --omit=peer --ignore-scripts --no-fund
          node - <<'NODE'
          const fs=require('fs');
          const requireAbsent=['prisma','@prisma/config','deepmerge-ts','@nestjs/cli','@nestjs/schematics'];
          for(const n of requireAbsent) {
            const found=fs.existsSync('node_modules/'+n+'/package.json');
            console.log('ABSENT '+n+': '+!found);
            if(found) process.exitCode=1;
          }
          for(const n of ['@nestjs/core','@prisma/client','bcrypt']){
            try{console.log('RUNTIME '+n+': '+require(n+'/package.json').version)}
            catch(e){console.error('Missing required runtime '+n);process.exitCode=1}
          }
          NODE
      - name: Synthetic API runtime smoke and least-privilege security audit
        working-directory: backend
        env:
          STAGING_SYNTHETIC_ONLY: 'true'
          STAGING_PUBLIC_HOST: unit.up.railway.app
          PARTNER_API_ENABLED: 'false'
          PARTNER_API_SIMPLEDMS_ENABLED: 'false'
          PORT: '8099'
        run: |
          node dist/partner-api/staging.main.js > "$RUNNER_TEMP/synthetic-smoke.log" 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8099/health/live > "$RUNNER_TEMP/live.json"; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/live.json"
          node -e "const j=require(process.env.RUNNER_TEMP+'/live.json');if(!j.syntheticOnly||!j.ok)process.exit(1)"
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/partners/v1/simpledms/auctions)"
          echo "Disabled partner endpoint returned HTTP $status"
          test "$status" = "404"
          npm audit --omit=dev --omit=peer --json > "$RUNNER_TEMP/isolated-runtime-audit.json" || true
          node -e "const a=require(process.env.RUNNER_TEMP+'/isolated-runtime-audit.json');const v=a.metadata?.vulnerabilities;if(!v)process.exit(2);console.log('ISOLATED RUNTIME '+JSON.stringify(v));if(v.critical>0)process.exit(1)"
      - name: Commit evaluated lockfile only after tests pass
        run: |
          test "$(git diff --name-only)" = "backend/package-lock.json"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "security: lock build-time-only Nest CLI and lean runtime dependency graph"
          git push origin HEAD:security/simpledms-runtime-prune-eval
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simpledms-pruned-runtime-audit
          path: ${{ runner.temp }}/isolated-runtime-audit.json
          retention-days: 7
