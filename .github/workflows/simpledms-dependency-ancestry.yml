name: Analyse remaining SimpleDMS dependency ancestry
on:
  push:
    branches:
      - security/simpledms-dependency-fixes
    paths:
      - .github/workflows/simpledms-dependency-ancestry.yml
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install lockfile tree without lifecycle scripts
        working-directory: backend
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Print unresolved dependency ancestry and runtime presence
        working-directory: backend
        run: |
          npm explain prisma || true
          npm explain @prisma/config || true
          npm explain deepmerge-ts || true
          npm explain brace-expansion || true
          npm explain bcrypt || true
          npm explain tar || true
          node - <<'NODE'
          const l=require('./package-lock.json').packages;
          for(const n of ['prisma','@prisma/config','deepmerge-ts','brace-expansion','bcrypt','tar']) {
            const v=l['node_modules/'+n];
            console.log('LOCK '+n+': '+JSON.stringify({version:v?.version,dev:v?.dev,optional:v?.optional,peer:v?.peer}));
          }
          NODE
