name: Backend CI and Fly Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/run-mazium-model-eval-on-fly.mjs'
      - '.github/workflows/backend-fly.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/run-mazium-model-eval-on-fly.mjs'
      - '.github/workflows/backend-fly.yml'

permissions:
  contents: read

concurrency:
  group: backend-fly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    name: Test and build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The backend compiles with SWC, which strips types without checking
      # them, so `npm run build` exits 0 with type errors present. That is how
      # a removed Prisma model and a stale chat-room key reached production as
      # runtime 500s. This step is the only thing that reads those types.
      - name: Typecheck backend
        run: npm run typecheck

      - name: Run backend tests
        run: npm test -- --runInBand

      - name: Test evaluation language assertions
        run: node --test evaluations/evaluation-text.test.cjs

      - name: Build backend
        run: npm run build

  integration-security:
    name: Disposable PostgreSQL authorization and TradeXchange payments
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa_isolated_only
          POSTGRES_DB: carmazium_damage_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d carmazium_damage_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://qa:qa_isolated_only@127.0.0.1:5432/carmazium_damage_qa?schema=public
      DIRECT_URL: postgresql://qa:qa_isolated_only@127.0.0.1:5432/carmazium_damage_qa?schema=public
      DAMAGE_POSTGRES_TEST: '1'
      TRADE_POSTGRES_TEST: '1'
      WARRANTY_POSTGRES_TEST: '1'
      CARAVAN_POSTGRES_TEST: '1'
      GUEST_ENQUIRY_POSTGRES_TEST: '1'
      SUPABASE_URL: https://synthetic-damage-qa.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prepare disposable PostgreSQL schema only
        run: npx prisma db push --skip-generate
      - name: Test owner, outsider, photo and dealer role with real transactions
        run: npm test -- --runInBand src/damage/damage.integration.spec.ts src/services/services.audit.integration.spec.ts src/analytics/valuation-reliability.integration.spec.ts src/warranties/warranties.integration.spec.ts src/listings/caravan.integration.spec.ts src/listings/guest-enquiry.integration.spec.ts src/users/website-introduction.integration.spec.ts src/dealers/dealers.crm.integration.spec.ts src/chat/support-human-handoff.integration.spec.ts src/ai/mazium-support-dispatcher.integration.spec.ts

  intelligence-evaluation:
    name: Evaluate MaziuM on 142 conversations and 11 account fixtures
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-build, integration-security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Evaluate candidate code without customer data or production DB access
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/run-mazium-model-eval-on-fly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mazium-model-evaluation
          path: /tmp/mazium-model-evaluation.jsonl

  deploy:
    name: Deploy backend to Fly.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-build, integration-security, intelligence-evaluation]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy existing Fly app
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Confirm deployed MaziuM support worker is operational
        run: |
          set -eu
          for attempt in $(seq 1 15); do
            body="$(curl --connect-timeout 4 --max-time 10 --fail --silent --show-error https://carmazium-hjoh9w.fly.dev/ai/support/health || true)"
            if printf '%s' "$body" | grep -q '"ready":true'; then
              echo "MaziuM worker is active on the deployed API."
              exit 0
            fi
            echo "MaziuM worker not ready on check $attempt/15"
            sleep 4
          done
          # Only coarse operational state is published; no secrets or user data.
          printf 'Deployed MaziuM worker status: %s\n' "$body"
          exit 1
