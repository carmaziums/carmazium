name: Backend CI and Fly Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-fly.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-fly.yml'

permissions:
  contents: read

concurrency:
  group: backend-fly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build:
    name: Test and build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The backend compiles with SWC, which strips types without checking
      # them, so `npm run build` exits 0 with type errors present. That is how
      # a removed Prisma model and a stale chat-room key reached production as
      # runtime 500s. This step is the only thing that reads those types.
      - name: Typecheck backend
        run: npm run typecheck

      - name: Run backend tests
        run: npm test -- --runInBand

      - name: Build backend
        run: npm run build

  integration-security:
    name: Disposable PostgreSQL damage authorization
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa_isolated_only
          POSTGRES_DB: carmazium_damage_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d carmazium_damage_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://qa:qa_isolated_only@127.0.0.1:5432/carmazium_damage_qa?schema=public
      DIRECT_URL: postgresql://qa:qa_isolated_only@127.0.0.1:5432/carmazium_damage_qa?schema=public
      DAMAGE_POSTGRES_TEST: '1'
      SUPABASE_URL: https://synthetic-damage-qa.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prepare disposable PostgreSQL schema only
        run: npx prisma db push --skip-generate
      - name: Test owner, outsider, photo and dealer role with real transactions
        run: npm test -- --runInBand src/damage/damage.integration.spec.ts

  deploy:
    name: Deploy backend to Fly.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-build, integration-security]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy existing Fly app
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
