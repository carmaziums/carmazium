name: Mobile authentication and guided tour
on:
  pull_request:
    paths:
      - 'carmazium app/carmazium app/App.tsx'
      - 'carmazium app/carmazium app/package*.json'
      - 'carmazium app/carmazium app/src/lib/authSubscription.ts'
      - 'carmazium app/carmazium app/src/lib/*Tour*.ts'
      - 'carmazium app/carmazium app/src/store/authStore.ts'
      - 'carmazium app/carmazium app/src/store/guidedTourStore.ts'
      - 'carmazium app/carmazium app/src/screens/auth/**'
      - 'carmazium app/carmazium app/src/screens/main/SettingsScreen.tsx'
      - 'carmazium app/carmazium app/src/components/Native*Tour*.tsx'
      - 'carmazium app/carmazium app/scripts/test-auth-subscription.test.mjs'
      - 'carmazium app/carmazium app/scripts/test-guided-tour.test.mjs'
      - 'carmazium app/carmazium app/scripts/sync-guided-tour.mjs'
      - 'src/lib/guidedWebsiteTour.ts'
      - '.github/workflows/mobile-auth-tour-ci.yml'
permissions:
  contents: read
jobs:
  auth-tour:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'carmazium app/carmazium app'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'carmazium app/carmazium app/package-lock.json'
      - run: npm ci
      - run: node scripts/sync-guided-tour.mjs --check
      - run: node --test scripts/test-auth-subscription.test.mjs scripts/test-guided-tour.test.mjs
      - run: npm run typescript
