name: Temporary Scoped bcrypt6 Cross-Version Remediation

on:
  pull_request:
    branches: [security-backend-compatible-lockfile-20261003]
    paths:
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/scripts/verify-bcrypt6-compatibility.cjs'
      - 'backend/src/auth/bcrypt-v6-upgrade.spec.ts'
      - '.github/workflows/security-backend-bcrypt6-migration.yml'

permissions:
  contents: write

jobs:
  bcrypt5-to-bcrypt6-compatibility:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'security-backend-bcrypt6-compatibility-20261003'
      && github.event.pull_request.base.ref == 'security-backend-compatible-lockfile-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact preapproved draft security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up supported backend runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify old lockfile and new paired bcrypt declarations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:backend/package-lock.json" > /tmp/bcrypt5-source-lock.json
          node -e '
            const old=require("/tmp/bcrypt5-source-lock.json");
            const next=require("./backend/package.json");
            if(old.packages?.["node_modules/bcrypt"]?.version!=="5.1.1")
              throw Error("Not rebased on tested bcrypt5 lockfile");
            if(next.dependencies.bcrypt!=="6.0.0"
              || next.devDependencies["@types/bcrypt"]!=="6.0.0"
              || next.devDependencies.prisma!=="^6.19.2"
              || next.dependencies["@prisma/client"]!=="^6.19.2")
              throw Error("Unsafe unreviewed dependency constraints");
          '
      - name: Generate test-only hash vectors using the genuine old bcrypt5 native addon
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          mkdir -p "$scratch/legacy"
          npm install --prefix "$scratch/legacy" --save-exact --no-fund --no-audit bcrypt@5.1.1
          export BCRYPT_LEGACY_MODULE="$scratch/legacy/node_modules/bcrypt"
          export BCRYPT_SYNTHETIC_FIXTURE_PATH="$scratch/synthetic-v5-hashes.json"
          echo "BCRYPT_LEGACY_MODULE=$BCRYPT_LEGACY_MODULE" >> "$GITHUB_ENV"
          echo "BCRYPT_SYNTHETIC_FIXTURE_PATH=$BCRYPT_SYNTHETIC_FIXTURE_PATH" >> "$GITHUB_ENV"
          node backend/scripts/verify-bcrypt6-compatibility.cjs generate
      - name: Generate reviewed bcrypt6 and matching types lockfile without force
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-fund \
            > /tmp/bcrypt6-compatible-audit-fixes.log 2>&1 || true
          cd ..
          node -e '
            const l=require("./backend/package-lock.json");
            const m=require("./backend/package.json");
            const fs=require("fs"),cp=require("child_process");
            if(l.packages[""].dependencies.bcrypt!=="6.0.0"
               || l.packages[""].devDependencies["@types/bcrypt"]!=="6.0.0"
               || l.packages["node_modules/bcrypt"].version!=="6.0.0"
               || l.packages["node_modules/@types/bcrypt"].version!=="6.0.0")
              throw Error("Lockfile fails paired bcrypt6/type6 pin requirement");
            if(m.dependencies["@prisma/client"]!=="^6.19.2"
               || m.devDependencies.prisma!=="^6.19.2")
              throw Error("Prisma versions changed unexpectedly");
            const files=cp.execFileSync("git",["diff","--name-only"],{encoding:"utf8"}).trim().split("\n").filter(Boolean);
            if(files.length!==1 || files[0]!=="backend/package-lock.json")
              throw Error("Unexpected generated source changes: "+files.join(","));
            const direct=l.packages["node_modules/bcrypt"];
            console.log("REVIEWED_BCRYPT6_INSTALL "+JSON.stringify({
              version:direct.version,legacyPrebuiltToolPresent:Object.keys(l.packages)
                .some(k=>k.includes("@mapbox/node-pre-gyp"))}));
          '
      - name: Refuse critical findings after major upgrade
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && npm audit --package-lock-only --omit=dev --json > /tmp/bcrypt6-audit.json) || true
          node -e '
            const fs=require("fs"),x=JSON.parse(fs.readFileSync("/tmp/bcrypt6-audit.json","utf8"));
            const counts=x.metadata?.vulnerabilities;
            if(!counts||!Number.isInteger(counts.critical)||!Number.isInteger(counts.high))
              throw Error("npm audit unavailable; fail closed");
            const rem=Object.entries(x.vulnerabilities||{})
              .filter(([,e])=>["critical","high"].includes(e.severity))
              .map(([pkg,e])=>({pkg,severity:e.severity,direct:Boolean(e.isDirect)}));
            console.log("BCRYPT6_PATCH_AUDIT "+JSON.stringify({
              critical:counts.critical,high:counts.high,moderate:counts.moderate,remaining:rem}));
            if(counts.critical!==0||counts.high>6)
              throw Error("Critical dependency still present or security regression; no lockfile commit");
          '
      - name: Clean install with actual bcrypt6 native module and full auth regression
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm ci --no-fund --no-audit
          node scripts/verify-bcrypt6-compatibility.cjs verify
          npm test -- --runInBand --runTestsByPath src/auth/bcrypt-v6-upgrade.spec.ts
          npm run typecheck
          npm test -- --runInBand
          npm run build
      - name: Require equal audit after native installation
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && npm audit --package-lock-only --omit=dev --json > /tmp/bcrypt6-post-build-audit.json) || true
          node -e '
            const fs=require("fs"),a=JSON.parse(fs.readFileSync("/tmp/bcrypt6-post-build-audit.json","utf8"));
            const c=a.metadata?.vulnerabilities;
            if(!c||c.critical!==0||c.high>6)
              throw Error("Bcrypt6 security audit regressed or unavailable");
            console.log("BCRYPT6_AFTER_FULL_BACKEND_BUILD "+JSON.stringify({
              critical:c.critical,high:c.high,moderate:c.moderate,low:c.low}));
          '
      - name: Commit tested lockfile ONLY to this security draft branch
        shell: bash
        run: |
          set -euo pipefail
          target="security-backend-bcrypt6-compatibility-20261003"
          actual="$(git ls-remote origin "refs/heads/$target" | cut -f1)"
          test "$actual" = "$(git rev-parse HEAD)"
          test "$(git diff --name-only)" = "backend/package-lock.json"
          git add -- backend/package-lock.json
          git -c user.name='CarMazium Security CI' \
            -c user.email='security-ci@users.noreply.github.com' \
            commit -m 'Security: verified bcrypt6 and v5 backwards-compatible backend lockfile'
          git push origin "HEAD:refs/heads/$target"
          echo BCRYPT6_VERIFIED_LOCKFILE_COMMITTED
