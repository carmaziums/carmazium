name: Evaluate bcrypt 6 security remediation
on:
  push:
    branches:
      - security/simpledms-bcrypt6-evaluation
    paths:
      - .github/workflows/simpledms-bcrypt6-evaluation.yml
permissions:
  contents: write
jobs:
  upgrade-evaluation:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/security/simpledms-bcrypt6-evaluation'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Update lockfile for precisely declared bcrypt 6
        working-directory: backend
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          cd ..
          test "$(git diff --name-only)" = "backend/package-lock.json"
          git diff --check
      - name: Install, typecheck, test and build isolated security branch
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand
          npm run build
      - name: Re-audit production dependency tree
        working-directory: backend
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/bcrypt6-audit.json" || true
          node -e "const a=require(process.env.RUNNER_TEMP+'/bcrypt6-audit.json'); const v=a.metadata?.vulnerabilities; if(!v)process.exit(2);console.log('bcrypt6 vulnerability counts: '+JSON.stringify(v)); const still=a.vulnerabilities||{};if(still.tar||still.bcrypt)process.exit(1)"
      - name: Commit only the generated lockfile on successful tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "security: update bcrypt 6 lockfile after passing backend tests"
          git push origin HEAD:security/simpledms-bcrypt6-evaluation
      - name: Preserve remaining dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simpledms-bcrypt6-evaluation
          path: ${{ runner.temp }}/bcrypt6-audit.json
          retention-days: 7
