name: Dealer Navigation Regression Guards

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dealer-navigation-guards.yml'
      - 'scripts/test-dealer-dashboard-navigation.test.mjs'
      - 'scripts/test-native-visual-baseline-block1.test.mjs'
      - 'src/config/dealerRouteConfig.ts'
      - 'src/components/dashboard/DashboardSidebar.tsx'
      - 'src/components/dealer/**'
      - 'src/app/dashboard/dealer/**'
      - 'carmazium app/carmazium app/src/navigation/TabNavigator.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dealer-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install source-test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify dealer links, redirects, permissions, and native route inventory
        run: node --test scripts/test-dealer-dashboard-navigation.test.mjs scripts/test-native-visual-baseline-block1.test.mjs
