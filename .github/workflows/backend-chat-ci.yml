name: Backend Chat CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-chat-ci.yml"

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run chat regression tests
        run: npm test -- --runInBand chat/chat.service.spec.ts chat/chat.gateway.spec.ts chat/chat-rate-limit.service.spec.ts admin-messaging/admin-messaging.service.spec.ts

      - name: Run Analytics accuracy, performance and event-integrity regression tests
        run: npm test -- --runInBand analytics/analytics-data-accuracy.spec.ts analytics/analytics-reliability.spec.ts analytics/analytics-event-policy.spec.ts analytics/valuation-history.service.spec.ts

      - name: Run dealer purchase record, snapshot and inspection-note tests
        run: npm test -- --runInBand dealers/dealers.purchase-detail.spec.ts dealers/purchase-snapshot.spec.ts dealers/dealer-access.spec.ts sale-cancellations/sale-cancellations.mine.spec.ts listings/buyer-complete-sale.spec.ts listings/linked-retail-manual-sale.spec.ts
