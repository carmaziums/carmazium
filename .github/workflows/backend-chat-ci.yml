name: Backend Chat CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-chat-ci.yml"

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run chat authorization tests
        run: npm test -- --runInBand chat/chat.service.spec.ts
