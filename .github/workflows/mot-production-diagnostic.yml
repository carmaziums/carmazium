name: MOT upstream diagnostic
on:
  pull_request:
    paths:
      - 'scripts/mot-production-diagnostic.mjs'
      - '.github/workflows/mot-production-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/mot-production-diagnostic.mjs'
      - '.github/workflows/mot-production-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/mot-production-diagnostic.mjs
      - name: Read sanitized upstream status on production machine
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/mot-production-diagnostic.mjs
