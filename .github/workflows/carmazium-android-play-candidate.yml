name: CarMazium Google Play production AAB candidate (internal review only)
# Manual only. Never publishes a website APK, store release, or OTA update.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main source SHA for candidate
        type: string
        required: true
      approval:
        description: Candidate only; not customer distribution
        type: choice
        required: true
        options: [NOT_APPROVED, INTERNAL_REVIEW_ONLY]
      version_code:
        description: Unique, increasing Android release versionCode (1 to 2147483647)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: carmazium-android-play-review
  cancel-in-progress: false
jobs:
  candidate:
    # Do not expose signing secrets on non-main manual dispatches.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: 'carmazium app/carmazium app'
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      APP_ENV: 'production'
      CARMAZIUM_CANDIDATE_SOURCE_SHA: ${{ inputs.source_sha }}
      CARMAZIUM_ANDROID_CANDIDATE_APPROVAL: ${{ inputs.approval }}
      CARMAZIUM_ANDROID_CANDIDATE_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'carmazium app/carmazium app/package-lock.json'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked native packages
        run: npm ci
      - name: Block critical production dependency advisories
        run: npm audit --omit=dev --audit-level=critical
      - name: Reject missing keystore, unsigned candidate and wrong source SHA
        env:
          CARMAZIUM_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          CARMAZIUM_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_KEY_ALIAS }}
          CARMAZIUM_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_STORE_PASSWORD }}
          CARMAZIUM_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_KEY_PASSWORD }}
          CARMAZIUM_ANDROID_RELEASE_CERT_SHA256: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_CERT_SHA256 }}
        run: node ../../scripts/check-android-release-candidate.mjs
      - name: Restore keystore in ephemeral runner only
        env:
          CARMAZIUM_ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          CARMAZIUM_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_KEY_ALIAS }}
          CARMAZIUM_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_STORE_PASSWORD }}
          CARMAZIUM_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p keystores
          printf '%s' "$CARMAZIUM_ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > keystores/customer-release.jks
          test -s keystores/customer-release.jks
          node - <<'NODE'
          const fs=require('fs');
          const keys={
            MYAPP_RELEASE_STORE_FILE:'customer-release.jks',
            MYAPP_RELEASE_KEY_ALIAS:process.env.CARMAZIUM_ANDROID_RELEASE_KEY_ALIAS,
            MYAPP_RELEASE_STORE_PASSWORD:process.env.CARMAZIUM_ANDROID_RELEASE_STORE_PASSWORD,
            MYAPP_RELEASE_KEY_PASSWORD:process.env.CARMAZIUM_ANDROID_RELEASE_KEY_PASSWORD,
          };
          for(const [k,v] of Object.entries(keys))
            if(!v || /[\r\n]/.test(v)) throw Error('Malformed signing property: '+k);
          fs.writeFileSync('keystores/release.keystore.properties',
            Object.entries(keys).map(([k,v])=>k+'='+v).join('\n')+'\n',{mode:0o600});
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          // Since v126 was an APK-only release with Expo OTA disabled, a new
          // 1.0.2 native runtime and original-signed build are required first.
          // Only the company's production channel can deliver compatible
          // JavaScript updates after a separately approved publish.
          const updateUrl='https://u.expo.dev/9c77bb81-205c-42f8-913e-b69a0953ec10';
          if(app.expo.owner!=='carmazium' ||
             app.expo.version!=='1.0.2' ||
             app.expo.runtimeVersion?.policy!=='appVersion' ||
             app.expo.updates?.enabled!==true ||
             app.expo.updates?.url!==updateUrl ||
             app.expo.updates?.requestHeaders?.['expo-channel-name'] ||
             Number(process.env.CARMAZIUM_ANDROID_CANDIDATE_VERSION_CODE)<127){
            throw Error('A new source-locked v127+ OTA runtime is required; source must not pin the preview channel');
          }
          // The signed APK is built outside EAS Build; explicitly embed the
          // company production channel at native prebuild time only. Source
          // preview/TestFlight profiles must retain their own EAS channels.
          app.expo.updates.requestHeaders={'expo-channel-name':'production'};
          // Android sideloaded updates must have a higher versionCode than the prior APK.
          app.expo.android.versionCode=Number(process.env.CARMAZIUM_ANDROID_CANDIDATE_VERSION_CODE);
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          const eas=JSON.parse(fs.readFileSync('eas.json','utf8'));
          for(const key of ['EXPO_PUBLIC_API_URL','EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_ANON_KEY','EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY']){
            const value=eas.build.production.env[key];
            if(!value||/[\r\n]/.test(value))throw Error('Missing production client variable: '+key);
            fs.appendFileSync(process.env.GITHUB_ENV,key+'='+value+'\n');
          }
          NODE
      - name: Verify owner-pinned certificate and private signing key before build
        env:
          CARMAZIUM_ANDROID_RELEASE_KEYSTORE_PATH: keystores/customer-release.jks
          CARMAZIUM_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_KEY_ALIAS }}
          CARMAZIUM_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_STORE_PASSWORD }}
          CARMAZIUM_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_KEY_PASSWORD }}
          CARMAZIUM_ANDROID_RELEASE_CERT_SHA256: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_CERT_SHA256 }}
        run: node ../../scripts/verify-android-release-keystore.mjs
      - name: Ensure Android API 36 and signing tools exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Configure Google Play updates and remove package-install permission
        run: node ../../scripts/prepare-google-play-distribution.mjs
      - name: Prepare Android project and assert release signing
        run: |
          npm run typescript
          npx expo prebuild --platform android --non-interactive --clean
          grep -F 'signingConfig signingConfigs.release' android/app/build.gradle
          test "$(node -p "require('./app.json').expo.android.package")" = 'uk.carmazium.app'
          test "$(node -p "require('./app.json').expo.updates.enabled")" = 'false'
          if grep -E '<uses-permission[^>]*android.permission.REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml | grep -v 'tools:node="remove"'; then
            echo '::error::Google Play build must not request APK installation permission.'
            exit 1
          fi
          test "$(node -p "require('./app.json').expo.runtimeVersion.policy")" = 'appVersion'
          test "$(node -p "require('./app.json').expo.version")" = '1.0.2'
          test "$(node -p "require('./app.json').expo.android.versionCode")" = "$CARMAZIUM_ANDROID_CANDIDATE_VERSION_CODE"
      - name: Build AAB with retained release signing key
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 --max-workers 2 --no-daemon
      - name: Verify signed bundle and generate retained-signer installation APK
        env:
          CARMAZIUM_ANDROID_RELEASE_CERT_SHA256: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_CERT_SHA256 }}
          CARMAZIUM_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_KEY_ALIAS }}
          CARMAZIUM_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_STORE_PASSWORD }}
          CARMAZIUM_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bundle="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          tool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https'             https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$tool"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$tool" | sha256sum --check --strict
          java -jar "$tool" validate --bundle="$bundle"
          java -jar "$tool" dump manifest --bundle="$bundle" > "$RUNNER_TEMP/play-manifest.xml"
          python3 - "$RUNNER_TEMP/play-manifest.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          permissions = {p.get(android + 'name') for p in root.findall('uses-permission')}
          if 'android.permission.REQUEST_INSTALL_PACKAGES' in permissions:
              raise SystemExit('Play AAB contains forbidden self-install permission')
          enabled = root.findall("./application/meta-data[@"+android+"name='expo.modules.updates.ENABLED']")
          if len(enabled) != 1 or enabled[0].get(android + 'value') != 'false':
              raise SystemExit('Play AAB must keep direct-channel OTA disabled')
          print('Final Play manifest: no package installer permission; store-managed updates.')
          PY
          test "$(java -jar "$tool" dump manifest --bundle="$bundle" --xpath='/manifest/@package')" = uk.carmazium.app
          test "$(java -jar "$tool" dump manifest --bundle="$bundle" --xpath='/manifest/@android:versionCode')" = "$CARMAZIUM_ANDROID_CANDIDATE_VERSION_CODE"
          test "$(java -jar "$tool" dump manifest --bundle="$bundle" --xpath='/manifest/@android:versionName')" = 1.0.2
          mkdir -p "$GITHUB_WORKSPACE/review-only-apk"
          java ../../scripts/VerifyAndroidAppBundle.java "$bundle" "$CARMAZIUM_ANDROID_RELEASE_CERT_SHA256"             > "$GITHUB_WORKSPACE/review-only-apk/aab-signature-verification.json"
          # Never pass password values as command arguments or use bundletool's debug-key fallback.
          printf '%s' "$CARMAZIUM_ANDROID_RELEASE_STORE_PASSWORD" > "$RUNNER_TEMP/play-store-password"
          printf '%s' "$CARMAZIUM_ANDROID_RELEASE_KEY_PASSWORD" > "$RUNNER_TEMP/play-key-password"
          java -jar "$tool" build-apks --bundle="$bundle" --output="$RUNNER_TEMP/play-universal.apks" --mode=universal             --ks=keystores/customer-release.jks --ks-key-alias="$CARMAZIUM_ANDROID_RELEASE_KEY_ALIAS"             --ks-pass="file:$RUNNER_TEMP/play-store-password" --key-pass="file:$RUNNER_TEMP/play-key-password"
          mkdir -p android/app/build/outputs/apk/release
          unzip -p "$RUNNER_TEMP/play-universal.apks" universal.apk > android/app/build/outputs/apk/release/app-release.apk
          cp "$bundle" "$GITHUB_WORKSPACE/review-only-apk/CarMazium-Google-Play-REVIEW-ONLY.aab"
      - name: Reject debug signer and verify production package and checksum
        env:
          CARMAZIUM_ANDROID_RELEASE_CERT_SHA256: ${{ secrets.CARMAZIUM_ANDROID_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$tools/apksigner"
          "$tools/apksigner" verify --verbose "$apk"
          actual="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$CARMAZIUM_ANDROID_RELEASE_CERT_SHA256" | sed -E 's/^[[:space:]]*[Ss][Hh][Aa]-?256[[:space:]]*:?//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo '::error::APK signer mismatch; NOT distributing debug or unsigned APK.'
            exit 1
          fi
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='uk.carmazium.app' versionCode='${CARMAZIUM_ANDROID_CANDIDATE_VERSION_CODE}'"
          echo "Source revision: $GITHUB_SHA; candidate versionCode: $CARMAZIUM_ANDROID_CANDIDATE_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$GITHUB_WORKSPACE/review-only-apk"
          cp "$apk" "$GITHUB_WORKSPACE/review-only-apk/CarMazium-Android-REVIEW-ONLY.apk"
          review_apk="$GITHUB_WORKSPACE/review-only-apk/CarMazium-Android-REVIEW-ONLY.apk"
          evidence="$GITHUB_WORKSPACE/review-only-apk/release-evidence.json"
          # Read the actual, signer-verified APK after copying, then re-check it.
          node ../../scripts/android-apk-release-evidence.mjs create "$review_apk" "$evidence"
          node ../../scripts/android-apk-release-evidence.mjs verify "$review_apk" "$evidence"
          (cd "$GITHUB_WORKSPACE/review-only-apk" && sha256sum CarMazium-Android-REVIEW-ONLY.apk > SHA256SUMS.txt)
          echo 'Verified private artifact manifest: release-evidence.json, APK and SHA256SUMS.txt.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Release signer verified. INTERNAL REVIEW ONLY; no public distribution authorised.' >> "$GITHUB_STEP_SUMMARY"
      - name: Bind AAB checksum to verified source and APK evidence
        shell: bash
        run: |
          set -euo pipefail
          node - "$GITHUB_WORKSPACE/review-only-apk" <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const dir=process.argv[2];
          const file='CarMazium-Google-Play-REVIEW-ONLY.aab';
          const aab=fs.readFileSync(path.join(dir,file));
          const apk=JSON.parse(fs.readFileSync(path.join(dir,'release-evidence.json'),'utf8'));
          const signature=JSON.parse(fs.readFileSync(path.join(dir,'aab-signature-verification.json'),'utf8'));
          const evidence={schemaVersion:1,sourceSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,packageName:'uk.carmazium.app',versionName:'1.0.2',versionCode:Number(process.env.CARMAZIUM_ANDROID_CANDIDATE_VERSION_CODE),file,size:aab.length,sha256:crypto.createHash('sha256').update(aab).digest('hex'),signature,installationApkEvidence:apk,distribution:'INTERNAL_REVIEW_ONLY'};
          fs.writeFileSync(path.join(dir,'play-release-evidence.json'),JSON.stringify(evidence,null,2)+'\n');
          NODE
          (cd "$GITHUB_WORKSPACE/review-only-apk" && sha256sum *.apk *.aab > SHA256SUMS.txt)
          echo 'This workflow does **not** submit to Google Play. Verify Play App Signing identity before upload; retain the original customer signing key.' >> "$GITHUB_STEP_SUMMARY"
      - name: Store verified Google Play bundle and installation test APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMazium-Google-Play-REVIEW-ONLY
          path: review-only-apk/*
          retention-days: 7
          if-no-files-found: error
      - name: Remove signing material from temporary runner
        if: always()
        shell: bash
        run: |
          rm -f keystores/customer-release.jks keystores/release.keystore.properties android/app/customer-release.jks "$RUNNER_TEMP/play-store-password" "$RUNNER_TEMP/play-key-password"
