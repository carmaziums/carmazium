name: One-time TradeXchange socket auth patch

on:
  push:
    branches: [fix/tradexchange-server-access]
    paths:
      - '.github/workflows/tradexchange-socket-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tradexchange-server-access
          fetch-depth: 0
      - name: Apply minimal auction socket auth patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app/auctions/live/[id]/page.tsx')
          text = path.read_text()

          old_import = 'import { getWebSocketUrl, createChatRoom } from "@/lib/chatApi"'
          new_import = 'import { getWebSocketUrl, createChatRoom, getAccessToken } from "@/lib/chatApi"'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('Expected chatApi import not found')

          old_socket = '''        const socket = io(`${getWebSocketUrl()}/auctions`, {\n            withCredentials: true,'''
          new_socket = '''        const socket = io(`${getWebSocketUrl()}/auctions`, {\n            auth: (cb) => {\n                getAccessToken().then(token => cb(token ? { token } : {})).catch(() => cb({}))\n            },\n            withCredentials: true,'''
          if old_socket in text:
              text = text.replace(old_socket, new_socket, 1)
          elif new_socket not in text:
              raise SystemExit('Expected auction socket block not found')

          path.write_text(text)
      - name: Commit only the live-auction token change
        run: |
          git config user.name "carmaziums"
          git config user.email "carmaziums@gmail.com"
          git add 'src/app/auctions/live/[id]/page.tsx'
          if git diff --cached --quiet; then
            echo "Socket auth patch already present"
            exit 0
          fi
          git commit -m "fix(tradexchange): authenticate live auction socket"
          git push origin HEAD:fix/tradexchange-server-access
