name: Profile PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/profile/**'
      - 'src/components/profile/**'
      - '.github/workflows/profile-pr-validation.yml'

permissions:
  contents: read

jobs:
  frontend-validation:
    name: Profile frontend lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint profile files only
        run: npx eslint 'src/app/profile/page.tsx' 'src/app/profile/[id]/page.tsx' 'src/components/profile/ProfileImageUploader.tsx' 'src/components/profile/ProfileReviewForm.tsx'

      - name: Typecheck frontend
        run: npx tsc --noEmit
