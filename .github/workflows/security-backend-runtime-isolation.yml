name: Temporary Scoped Backend Runtime Build-Tool Isolation

on:
  pull_request:
    branches: [security-backend-prisma6-config-advisory-20261003]
    paths:
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/docs/security-production-buildtool-dependency-isolation.md'
      - '.github/workflows/security-backend-runtime-isolation.yml'

permissions:
  contents: write

jobs:
  verify-real-production-runtime-tree:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'security-backend-runtime-build-tool-isolation-20261003'
      && github.event.pull_request.base.ref == 'security-backend-prisma6-config-advisory-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out preapproved isolated security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Use Node 20.20.2 compatible with Nest CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Verify expected reclassification and unchanged auth, Prisma and app source
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:backend/package.json" > /tmp/prior-backend-package.json
          node -e '
            const old=require("/tmp/prior-backend-package.json");
            const p=require("./backend/package.json");
            const tools=["@nestjs/cli","@nestjs/schematics"];
            for(const name of tools){
              if(old.dependencies[name]!=="^11.0.0" ||
                 p.devDependencies[name]!=="^11.0.0" ||
                 Object.hasOwn(p.dependencies,name))
                throw Error("Unexpected build-tool-only change "+name);
            }
            if(p.devDependencies["@swc/cli"]!=="^0.6.0" ||
               p.dependencies.bcrypt!=="6.0.0" ||
               p.dependencies["@prisma/client"]!=="6.19.3" ||
               p.devDependencies.prisma!=="6.19.3" ||
               p.overrides?.["@prisma/config"]?.["deepmerge-ts"]!=="8.0.2")
              throw Error("Unreviewed Prisma/bcrypt/SWC/source change");
          '
          if git grep -n -E "(['\\\"]@nestjs/(cli|schematics)['\\\"])" -- backend/src; then
            echo "Runtime import of supposedly build-only CLI detected"
            exit 1
          fi
      - name: Generate reviewed runtime-only dependency graph
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          node -e '
            const {execFileSync}=require("node:child_process");
            const l=require("./backend/package-lock.json");
            const root=l.packages[""];
            for(const name of ["@nestjs/cli","@nestjs/schematics"]){
              if(root.dependencies[name]||root.devDependencies[name]!=="^11.0.0")
                throw Error("CLI not moved to dev-only lockfile: "+name);
            }
            for(const [key,version] of Object.entries({
              "node_modules/bcrypt":"6.0.0",
              "node_modules/prisma":"6.19.3",
              "node_modules/@prisma/client":"6.19.3"})){
              if(l.packages[key]?.version!==version)
                throw Error("Prior security fix regressed "+key);
            }
            const diff=execFileSync("git",["diff","--name-only"],{encoding:"utf8"})
              .trim().split("\n").filter(Boolean);
            if(diff.length!==1||diff[0]!=="backend/package-lock.json")
              throw Error("Unexpected source edits: "+diff);
            console.log("BACKEND_PRODUCTION_BUILD_TOOLS_RECLASSIFIED_LOCKFILE");
          '
      - name: Audit exact proposed production lockfile; block if critical/high remain
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && npm audit --package-lock-only --omit=dev --json \
            > /tmp/runtime-audit.json) || true
          node -e '
            const fs=require("fs"),a=JSON.parse(fs.readFileSync("/tmp/runtime-audit.json","utf8"));
            const v=a.metadata?.vulnerabilities;
            if(!v||!Number.isInteger(v.critical)||!Number.isInteger(v.high))
              throw Error("Invalid npm advisory response");
            console.log("RECLASSIFIED_LOCKFILE_AUDIT "+JSON.stringify({
              critical:v.critical,high:v.high,moderate:v.moderate,low:v.low,
              remaining:Object.entries(a.vulnerabilities||{}).filter(([,x])=>
                ["critical","high","moderate"].includes(x.severity))
                  .map(([name,x])=>({name,severity:x.severity}))
            }));
            if(v.critical!==0||v.high!==0)
              throw Error("Unsafe critical/high runtime graph; never commit lockfile");
          '
      - name: Clean all-dependency builder install and complete backend regression
        shell: bash
        env:
          DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/synthetic
          DIRECT_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/synthetic
        run: |
          set -euo pipefail
          cd backend
          npm ci --no-audit --no-fund
          node scripts/check-prisma-config-security.cjs
          npx prisma validate
          npx prisma generate
          npm test -- --runInBand --runTestsByPath src/auth/bcrypt-v6-upgrade.spec.ts
          npm run typecheck
          npm test -- --runInBand
          npm run build
          echo BUILD_TOOL_DEPENDENCIES_AVAILABLE_ONLY_DURING_BUILDER_STAGE
      - name: Independently install actual production-only dependency tree
        shell: bash
        run: |
          set -euo pipefail
          prod="$(mktemp -d)"
          cp backend/package.json backend/package-lock.json "$prod/"
          (cd "$prod" && NODE_ENV=production npm ci --omit=dev --no-audit --no-fund)
          (cd "$prod" && npm ls --omit=dev --all --json > /tmp/actual-prod-tree.json) || true
          node -e '
            const fs=require("fs"),x=JSON.parse(fs.readFileSync("/tmp/actual-prod-tree.json","utf8"));
            const never=new Set(["@nestjs/cli","@nestjs/schematics","@swc/cli",
              "@xhmikosr/bin-wrapper","@xhmikosr/downloader"]);
            const required=new Set(["@nestjs/core","@nestjs/swagger","bcrypt","@prisma/client"]);
            const seen=new Set(),bad=[];
            function traverse(deps,parent,depth){
              if(!deps||depth>18)return;
              for(const [name,d] of Object.entries(deps)){
                seen.add(name);
                if(never.has(name))bad.push(parent+"/"+name+"@"+d.version);
                traverse(d.dependencies,parent+"/"+name,depth+1);
              }
            }
            traverse(x.dependencies,"production",0);
            if(bad.length)throw Error("Runtime still installs build CLI/SWC chain: "+bad.join(","));
            const absent=[...required].filter(x=>!seen.has(x));
            if(absent.length)throw Error("Required runtime dependency absent: "+absent.join(","));
            console.log("PRODUCTION_RUNTIME_GRAPH_ISOLATION_PASS "+JSON.stringify({
              excluded:[...never],presentRequired:[...required]}));
          '
          (cd "$prod" && npm audit --omit=dev --json > /tmp/installed-runtime-audit.json) || true
          node -e '
            const fs=require("fs"),a=JSON.parse(fs.readFileSync("/tmp/installed-runtime-audit.json","utf8"));
            const v=a.metadata?.vulnerabilities;
            if(!v||v.critical!==0||v.high!==0)
              throw Error("Installed production dependency graph contains critical/high advisory");
            console.log("ACTUALLY_INSTALLED_PRODUCTION_AUDIT "+JSON.stringify({
              critical:v.critical,high:v.high,moderate:v.moderate,low:v.low}));
          '
          (cd "$prod" && node -e '
            const bcrypt=require("bcrypt");
            (async()=>{
              const digest=await bcrypt.hash("public synthetic CI password#2026",10);
              if(!(await bcrypt.compare("public synthetic CI password#2026",digest))
                 ||await bcrypt.compare("incorrect password",digest))
                throw Error("Runtime native bcrypt compatibility failed");
              console.log("PRODUCTION_NATIVE_BCRYPT_HASH_COMPARE_PASS");
            })().catch(e=>{console.error(e.message);process.exitCode=1;});
          ')
      - name: Commit ONLY verified backend lockfile to designated security branch
        shell: bash
        run: |
          set -euo pipefail
          target="security-backend-runtime-build-tool-isolation-20261003"
          remote="$(git ls-remote origin "refs/heads/$target" | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)"
          test "$(git diff --name-only)" = "backend/package-lock.json"
          git add -- backend/package-lock.json
          git -c user.name='CarMazium Security CI' -c user.email='security-ci@users.noreply.github.com' \
            commit -m 'Security: separate Nest build CLI and SWC from actual production dependency tree'
          git push origin "HEAD:refs/heads/$target"
          echo BACKEND_RUNTIME_ONLY_LOCKFILE_VERIFIED_AND_COMMITTED
