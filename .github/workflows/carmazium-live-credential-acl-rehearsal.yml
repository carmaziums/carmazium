name: Simulate production partner credential ACL containment (synthetic PostgreSQL)
on:
  push:
    branches: [security/carmazium-live-privilege-audit-20261003]
    paths:
      - backend/scripts/security/ci-only-partner-credential-acl.sql
      - .github/workflows/carmazium-live-credential-acl-rehearsal.yml
  pull_request:
    branches: [integration/simpledms-staging-candidate-20261003]
    paths:
      - backend/scripts/security/ci-only-partner-credential-acl.sql
      - .github/workflows/carmazium-live-credential-acl-rehearsal.yml
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cm_acl_ci
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: synthetic-fixture-password-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_admin -d cm_acl_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install ephemeral PostgreSQL client
        run: sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client
      - name: Run exact targeted ACL regression on disposable synthetic roles only
        env:
          PGPASSWORD: synthetic-fixture-password-only
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -U ci_admin -d cm_acl_ci \
            -v ON_ERROR_STOP=1 -f backend/scripts/security/ci-only-partner-credential-acl.sql
          echo "PASS: synthetic partner keys cannot be read by anon/authenticated; service and unrelated public operations remain permitted. No live Supabase access."
