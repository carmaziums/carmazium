name: Mobile Chat CI

on:
  pull_request:
    paths:
      - "carmazium app/carmazium app/src/context/ChatContext.tsx"
      - "carmazium app/carmazium app/src/lib/chatApi.ts"
      - "carmazium app/carmazium app/src/screens/main/ChatScreen.tsx"
      - ".github/workflows/mobile-chat-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "carmazium app/carmazium app"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "carmazium app/carmazium app/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile chat surfaces
        shell: bash
        run: |
          set +e
          OUTPUT="$(npm run typescript 2>&1)"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          CHAT_ERRORS="$(printf '%s\n' "$OUTPUT" | grep -E 'src/(context/ChatContext|lib/chatApi|screens/main/ChatScreen)\.tsx?' || true)"
          if [ -n "$CHAT_ERRORS" ]; then
            echo
            echo "TypeScript errors were found in mobile chat files changed by this PR:"
            printf '%s\n' "$CHAT_ERRORS"
            exit 1
          fi

          echo
          echo "Full mobile TypeScript has pre-existing errors outside the chat scope."
          echo "No TypeScript errors were reported in the mobile chat files changed by this PR."
