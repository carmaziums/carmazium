name: Apply YouTube video-first media patch

on:
  push:
    branches:
      - fix/youtube-video-first-media

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/youtube-video-first-media
          fetch-depth: 0

      - name: Patch vehicle detail media rendering
        run: python .github/scripts/apply-youtube-video-first-media.py

      - name: Commit patched listing media
        run: |
          if git diff --quiet -- src/app/buy-cars/'[slug]'/VehicleDetailsPageClient.tsx; then
            echo "No target changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/buy-cars/'[slug]'/VehicleDetailsPageClient.tsx
          git commit -m "fix(listing): show YouTube video before vehicle photos"
          git push origin HEAD:fix/youtube-video-first-media
